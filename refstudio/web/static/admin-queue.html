<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ref Studio Admin - Job Queue</title>
<link href="/static/css/app.css" rel="stylesheet"/>
<script type="module" src="/static/js/i18n.js"></script>
<script type="module" src="/static/js/api.js"></script>
<style>
.admin-shell { display: flex; height: 100vh; overflow: hidden; }
.admin-sidebar { width: 256px; flex-shrink: 0; background: var(--surface-2); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; padding: 16px 0; }
.admin-sidebar__brand { padding: 0 24px 24px; font-weight: 900; letter-spacing: -0.05em; font-size: var(--fs-headline); }
.admin-sidebar__link { display: flex; align-items: center; gap: 12px; padding: 8px 12px; margin: 0 8px; font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border-left: 2px solid transparent; border-radius: 0 var(--r-xs) var(--r-xs) 0; }
.admin-sidebar__link:hover { background: var(--surface-1); color: var(--ink); }
.admin-sidebar__link--active { background: var(--hairline); color: var(--ink); border-left-color: var(--ink); }
.admin-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.admin-content { flex: 1; display: flex; overflow: hidden; }
.queue-canvas { flex: 1; overflow-y: auto; padding: 24px; }
.metrics-bar { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--hairline); padding-bottom: 16px; margin-bottom: 24px; }
.metrics-group { display: flex; gap: 16px; align-items: center; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 8px 16px; font-size: var(--fs-body-sm); }
.metric-dot { width: 8px; height: 8px; border-radius: var(--r-full); }
.data-table { width: 100%; border-collapse: collapse; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-md); overflow: hidden; }
.data-table th { text-align: left; padding: 12px 16px; font-size: var(--fs-micro); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--hairline); background: var(--surface-1); }
.data-table td { padding: 12px 16px; border-bottom: 1px solid var(--hairline); font-size: var(--fs-body-sm); }
.data-table tr:hover td { background: var(--surface-1); }
.data-table tr.row-selected td { background: var(--hairline); }
.job-drawer { width: 320px; flex-shrink: 0; border-left: 1px solid var(--hairline); background: var(--surface-2); display: flex; flex-direction: column; }
.job-drawer__head { padding: 24px; border-bottom: 1px solid var(--hairline); }
.job-drawer__body { flex: 1; overflow-y: auto; padding: 24px; }
.job-drawer__foot { padding: 16px; border-top: 1px solid var(--hairline); }
.error-box { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 12px; font-family: ui-monospace, monospace; font-size: var(--fs-micro); color: var(--error); }
</style>
</head>
<body class="app app--fill">
<div class="admin-shell">
<nav class="admin-sidebar" aria-label="Admin">
<div class="admin-sidebar__brand">REF ADMIN</div>
<a class="admin-sidebar__link" href="/admin/tenants">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
<span data-i18n="admin.tenants">테넌트</span>
</a>
<a class="admin-sidebar__link admin-sidebar__link--active" href="/admin/queue" aria-current="page">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
<span data-i18n="admin.queue">작업 큐</span>
</a>
<a class="admin-sidebar__link" href="/admin/quarantine">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
<span data-i18n="admin.quarantine">검역</span>
</a>
<a class="admin-sidebar__link" href="/admin/audit">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
<span data-i18n="admin.audit">감사 로그</span>
</a>
</nav>
<div class="admin-main">
<header class="header header--static">
<span>Ref Studio · 관리 · 작업 큐</span>
<button class="btn btn--ghost" data-i18n="lang.toggle" data-lang-toggle>EN</button>
</header>
<div class="admin-content">
<div class="queue-canvas">
<div class="metrics-bar">
<h2 style="margin:0;font-size:var(--fs-headline);font-weight:700">Operation Desk</h2>
<div style="display:flex;gap:16px">
<div class="metrics-group">
<span class="metric-dot" style="background:var(--secondary)"></span><span style="color:var(--muted)">대기</span><strong>7</strong>
<span style="color:var(--muted)">|</span>
<span class="metric-dot" style="background:var(--ink)"></span><span style="color:var(--muted)">실행</span><strong>2</strong>
<span style="color:var(--muted)">|</span>
<span class="metric-dot" style="background:var(--error)"></span><span style="color:var(--muted)">실패</span><strong>1</strong>
</div>
<div class="metrics-group"><span style="color:var(--muted)">GPU 점유</span><strong class="mono">1/2</strong></div>
</div>
</div>
<table class="data-table">
<thead>
<tr><th>Job ID</th><th>Tenant</th><th>Task</th><th>Target</th><th>Status</th><th>Resource</th><th>Duration</th><th>Retries</th></tr>
</thead>
<tbody id="job-rows"></tbody>
</table>
</div>
<aside class="job-drawer">
<div class="job-drawer__head">
<div id="drawer-id" class="mono" style="font-size:var(--fs-micro);color:var(--muted);margin-bottom:4px">—</div>
<h3 id="drawer-target" style="margin:0;font-size:var(--fs-headline);font-weight:700">—</h3>
</div>
<div class="job-drawer__body">
<div class="section-label" style="font-size:var(--fs-micro);color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px">Failure Reason</div>
<div id="drawer-error" class="error-box">—</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px">
<div class="card"><div style="font-size:var(--fs-micro);color:var(--muted)">Retries</div><div id="drawer-retries" style="font-size:var(--fs-headline);font-weight:700">—</div></div>
<div class="card"><div style="font-size:var(--fs-micro);color:var(--muted)">Priority</div><div style="font-size:var(--fs-headline);font-weight:700">P2</div></div>
</div>
<p id="drawer-policy" style="margin-top:24px;font-size:var(--fs-body-sm);color:var(--muted);font-style:italic"></p>
</div>
<div class="job-drawer__foot">
<button class="btn btn--secondary" type="button" style="width:auto;padding:8px 16px;margin-left:auto">로그 보기</button>
</div>
</aside>
</div>
</div>
</div>
<script type="module">
import { api } from "/static/js/api.js";

const RETRY_CAP = 4;
let jobs = [];
let selected = null;
let policyNote = "";

const tbody = document.getElementById("job-rows");

function retryLabel(j) {
  if (j.status === "검역") return "—";
  const n = j.retries ?? 0;
  if (n >= RETRY_CAP) return `${n}/${RETRY_CAP} 한도 소진`;
  return `${n}/${RETRY_CAP}`;
}

function badgeClass(status) {
  if (status === "실행") return "badge--active";
  if (status === "실패") return "badge--error";
  if (status === "대기") return "badge--done";
  return "";
}

function renderTable() {
  tbody.innerHTML = "";
  jobs.forEach((j) => {
    const tr = document.createElement("tr");
    if (selected && selected.id === j.id) tr.className = "row-selected";
    if (j.status === "검역") tr.style.opacity = "0.6";
    const exhausted = (j.retries ?? 0) >= RETRY_CAP;
    if (j.status === "검역") {
      tr.innerHTML = `<td class="mono" style="color:var(--muted)">${j.id}</td><td>${j.tenant}</td><td class="mono" style="font-size:var(--fs-micro);color:var(--muted)">${j.kind}</td><td>${j.target}</td><td colspan="4"><span class="badge">검역으로 이동</span></td>`;
    } else {
      tr.innerHTML = `<td class="mono" style="color:var(--muted)">${j.id}</td><td>${j.tenant}</td><td class="mono" style="font-size:var(--fs-micro);color:var(--muted)">${j.kind}</td><td>${j.target}</td><td><span class="badge ${badgeClass(j.status)}">${j.status}</span></td><td class="mono" style="font-size:var(--fs-micro)">${j.gpu || "—"}</td><td style="color:var(--muted)">—</td><td style="color:${exhausted ? "var(--error)" : "var(--muted)"}">${retryLabel(j)}</td>`;
    }
    tr.addEventListener("click", () => selectJob(j));
    tbody.appendChild(tr);
  });
}

function selectJob(j) {
  selected = j;
  document.getElementById("drawer-id").textContent = j.id;
  document.getElementById("drawer-target").textContent = j.target;
  const fail = j.status === "실패";
  document.getElementById("drawer-error").textContent = fail ? (j.error || "작업 실패") : "—";
  const retriesEl = document.getElementById("drawer-retries");
  retriesEl.textContent = fail ? retryLabel(j) : "—";
  retriesEl.style.color = (j.retries ?? 0) >= RETRY_CAP ? "var(--error)" : "var(--ink)";
  document.getElementById("drawer-policy").textContent = fail ? `"${policyNote}"` : "";
  renderTable();
}

Promise.all([api("/admin/api/jobs"), api("/admin/api/policy")]).then(([jData, pol]) => {
  jobs = jData.jobs;
  policyNote = pol.note;
  const failed = jobs.find((j) => j.status === "실패") || jobs[0];
  if (failed) selectJob(failed);
  else renderTable();
}).catch((err) => { if (err.status === 401) location = "/admin/login"; });
</script>
</body>
</html>
