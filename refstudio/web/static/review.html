<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>REF STUDIO - 검수</title>
<link href="/static/css/app.css" rel="stylesheet"/>
<script type="module" src="/static/js/i18n.js"></script>
<script type="module" src="/static/js/api.js"></script>
</head>
<body class="app app--fill">
<header class="header header--static" style="height:56px">
<div style="display:flex;align-items:center;gap:16px">
<span class="header__brand" data-i18n="app.name">REF STUDIO</span>
<div class="header__divider"></div>
<h1 style="margin:0;font-size:var(--fs-headline);font-weight:700" data-i18n="nav.review">검수</h1>
<span style="font-size:var(--fs-body-sm);color:var(--muted);background:var(--surface-1);padding:4px 10px;border-radius:var(--r-sm)">s1 · 0:00–0:04</span>
</div>
<button class="btn btn--ghost" data-i18n="lang.toggle" data-lang-toggle>EN</button>
</header>
<main class="review-layout">
<div class="review-workspace">
<div class="compare-panes">
<div class="compare-pane">
<div class="compare-pane__head"><span>원본</span></div>
<div class="compare-pane__body"><div class="compare-pane__placeholder"></div></div>
</div>
<div class="compare-pane">
<div class="compare-pane__head"><span style="color:var(--ink)">재구성</span></div>
<div class="compare-pane__body"><div class="compare-pane__placeholder"></div></div>
</div>
</div>
<div class="transport">
<div style="display:flex;align-items:center;gap:16px">
<button class="btn--icon" style="background:var(--hairline)">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14l11-7z"/></svg>
</button>
<span class="mono" style="font-weight:700">18 <span style="color:var(--muted);font-weight:400">/ 120</span></span>
<span class="mono" style="color:var(--secondary);font-weight:700">00:00.18</span>
</div>
</div>
<div class="timeline">
<div class="timeline__ruler">
<div class="timeline__labels">Tracks</div>
<div style="flex:1"></div>
</div>
<div class="track track--selected">
<div class="track__label"><span class="mono" style="color:var(--accent)">e3</span><span>text</span></div>
<div class="track__lane"><div class="track__bar" style="left:10%;right:15%"></div></div>
</div>
<div class="track">
<div class="track__label"><span class="mono">e1</span><span>background</span></div>
<div class="track__lane"><div class="track__bar" style="left:0;right:0"></div></div>
</div>
<div class="track">
<div class="track__label"><span class="mono">e2</span><span>card</span></div>
<div class="track__lane"><div class="track__bar" style="left:5%;right:10%"></div></div>
</div>
</div>
</div>
<aside class="inspector">
<div class="inspector__head"><span>요소 4</span></div>
<div class="inspector__body">
<div class="element-row element-row--selected">
<div style="display:flex;gap:12px;align-items:center"><span class="mono" style="color:var(--accent)">e3</span><span>text</span></div>
<span style="font-size:var(--fs-micro);color:var(--muted)">수동</span>
</div>
<div class="element-row"><div style="display:flex;gap:12px"><span class="mono" style="color:var(--muted)">e1</span><span>background</span></div></div>
<div class="element-row"><div style="display:flex;gap:12px"><span class="mono" style="color:var(--muted)">e2</span><span>card</span></div></div>
<div class="element-row"><div style="display:flex;gap:12px"><span class="mono" style="color:var(--muted)">e4</span><span>price</span></div></div>
<button class="btn btn--primary-lg" style="margin:24px 0" data-i18n="review.keepSave">유지 조건 저장</button>
<div class="accordion"><div class="accordion__head"><span data-i18n="review.reassign">재할당</span></div></div>
<div class="accordion"><div class="accordion__head"><span data-i18n="review.mask">마스크</span></div></div>
<div class="accordion" style="border:1px solid var(--hairline)"><div class="accordion__head"><span data-i18n="review.bbox">박스 프롬프트</span></div></div>
<div class="accordion"><div class="accordion__head"><span data-i18n="review.text">텍스트</span></div></div>
</div>
</aside>
</main>
</body>
</html>
