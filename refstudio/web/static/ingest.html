<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ref Studio - 새 프로젝트</title>
<link href="/static/css/app.css" rel="stylesheet"/>
<script type="module" src="/static/js/i18n.js"></script>
<script type="module" src="/static/js/api.js"></script>
</head>
<body class="app app--fill">
<header class="header header--static">
<div class="header__brand" data-i18n="app.name">Ref Studio</div>
<div class="header__nav">
<button class="btn btn--ghost" data-i18n="lang.toggle" data-lang-toggle>EN</button>
</div>
</header>
<main class="split" style="margin-top:0">
<section class="split__main">
<h1 class="page-title">레퍼런스 영상</h1>
<p class="page-desc">평면 2D 모션그래픽 또는 UI 화면 녹화. 실사 푸티지는 받지 않습니다.</p>
<div class="card" style="margin-bottom:32px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:16px">
<div style="width:48px;height:48px;background:var(--hairline);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3V9z"/></svg>
</div>
<div>
<div style="font-weight:500;margin-bottom:4px">launch-card.mp4</div>
<div class="mono" style="font-size:var(--fs-micro);color:var(--muted)">1920x1080 · 30 fps · 4.2s</div>
</div>
</div>
<button class="btn--icon" aria-label="Remove">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
</button>
</div>
<div class="card">
<div class="segmented" style="margin-bottom:24px">
<button class="segmented__btn segmented__btn--active" data-i18n="ingest.range">구간 지정</button>
<button class="segmented__btn" data-i18n="ingest.full">전체 영상</button>
</div>
<div data-filmstrip class="filmstrip">
<div class="filmstrip__frame"></div>
<div class="filmstrip__frame"></div>
<div class="filmstrip__frame filmstrip__frame--active"></div>
<div class="filmstrip__frame filmstrip__frame--active"></div>
<div class="filmstrip__frame filmstrip__frame--active"></div>
<div class="filmstrip__frame"></div>
</div>
<div class="range-meta">선택 4.0초 · 120프레임 · 장면 1개</div>
<div style="display:flex;gap:16px;margin-top:16px;align-items:center">
<label style="font-size:var(--fs-micro);color:var(--muted)">시작</label>
<input class="input" style="width:64px;padding:4px 8px;text-align:center" type="text" value="0.4s"/>
<label style="font-size:var(--fs-micro);color:var(--muted)">끝</label>
<input class="input" style="width:64px;padding:4px 8px;text-align:center" type="text" value="4.4s"/>
</div>
</div>
</section>
<aside class="split__aside">
<h2 class="page-title" style="font-size:var(--fs-body-sm);margin-bottom:24px" data-i18n="ingest.confirm">실행 전 확인</h2>
<ul class="detail-list">
<li><span>예상 시간</span><span class="mono">3–5분</span></li>
<li><span>GPU 사용 허용</span><span>ON</span></li>
<li><span>장면</span><span>1</span></li>
</ul>
<div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
<button class="btn btn--primary-lg" data-i18n="ingest.start">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14l11-7z"/></svg>
분석 시작
</button>
<button class="btn btn--secondary">취소</button>
</div>
</aside>
</main>
</body>
</html>
