name: keepframe

# Push the image:
#   cp .env.example .env   # edit KEEPFRAME_IMAGE / KEEPFRAME_TAG
#   docker compose build
#   docker compose push
# Admin too: docker compose --profile admin up -d

x-keepframe: &keepframe
  image: ${KEEPFRAME_IMAGE:-westernbear/keepframe}:${KEEPFRAME_TAG:-0.1.0}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      KEEPFRAME_VERSION: ${KEEPFRAME_TAG:-0.1.0}
    tags:
      - ${KEEPFRAME_IMAGE:-westernbear/keepframe}:${KEEPFRAME_TAG:-0.1.0}
      - ${KEEPFRAME_IMAGE:-westernbear/keepframe}:latest
  restart: unless-stopped
  volumes:
    - ${KEEPFRAME_WORKSPACE:-./data/workspace}:/data/workspace
  # OSS default: thread. Cloud sets a module:Class runner; workers only call run_job().
  environment:
    KEEPFRAME_JOB_RUNNER: ${KEEPFRAME_JOB_RUNNER:-thread}

services:
  web:
    <<: *keepframe
    ports:
      - "${KEEPFRAME_PORT:-8765}:8765"
    command: ["serve", "--workspace", "/data/workspace", "--host", "0.0.0.0", "--port", "8765"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin:
    <<: *keepframe
    profiles: ["admin"]
    ports:
      - "${KEEPFRAME_ADMIN_PORT:-8766}:8765"
    command: ["serve", "--workspace", "/data/workspace", "--host", "0.0.0.0", "--port", "8765", "--admin"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/admin/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
