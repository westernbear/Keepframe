<!doctype html>
<html><head><meta charset="utf-8"><title>{{ID}}</title>
<style>
  html,body{margin:0;padding:0;background:{{BG}};overflow:hidden}
  #stage{position:relative;width:{{WIDTH}}px;height:{{HEIGHT}}px;background:{{BG}};overflow:hidden}
  .el{position:absolute;will-change:transform;transition:none!important}
  .el img{display:block;width:100%;height:100%;image-rendering:auto}
  .el span{display:block;width:100%;height:100%;white-space:pre;overflow:visible}
  .model-canvas{display:block;width:100%;height:100%;background:transparent}
  .ui-component{box-sizing:border-box;margin:0;border:0;background:transparent;color:inherit;font:inherit;overflow:hidden}
</style>
<script>{{GSAP_JS}}</script>
<script>{{CUSTOMEASE_JS}}</script>
<script>{{THREE_JS}}</script>
<script>{{GLTFLOADER_JS}}</script>
</head>
<body>
<div id="stage" data-composition-id="{{ID}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
{{ELEMENTS}}
</div>
<script>
const SCENE = {{SCENE_JSON}};
const FPS = SCENE.fps;
const DEFAULTS = {x:0,y:0,sx:1,sy:1,rot:0,skx:0,sky:0,opacity:1};
gsap.registerPlugin(CustomEase);
const tl = gsap.timeline({paused:true});
const appliers = [];
const uiStates = [...document.querySelectorAll('[data-ui-states]')].map(node => {
  const label = node.querySelector(':scope > .ui-component__text');
  return [node, label, JSON.parse(node.dataset.uiStates || '[]'), label?.textContent || '', node.style.backgroundColor, node.style.color];
});
const modelRenders = [];
const modelPromises = [...document.querySelectorAll('.model-canvas')].map(canvas => new Promise((resolve, reject) => {
  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:false, preserveDrawingBuffer:true});
  renderer.setPixelRatio(1);
  renderer.setSize(canvas.width, canvas.height, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  const aspect = canvas.width / Math.max(canvas.height, 1);
  const camera = new THREE.OrthographicCamera(-aspect, aspect, 1, -1, 0.01, 100);
  camera.position.set(0, 0, 4);
  const world = new THREE.Scene();
  world.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
  const light = new THREE.DirectionalLight(0xffffff, 0.8); light.position.set(2, 3, 4); world.add(light);
  new THREE.GLTFLoader().load(canvas.dataset.model, gltf => {
    const object = gltf.scene;
    const box = new THREE.Box3().setFromObject(object);
    const size = new THREE.Vector3(); const center = new THREE.Vector3();
    box.getSize(size); box.getCenter(center);
    object.position.sub(center);
    const extent = Math.max(size.x / aspect, size.y, size.z, 1e-6);
    object.scale.setScalar(1.8 / extent);
    world.add(object);
    const draw = () => renderer.render(world, camera);
    modelRenders.push(draw); draw(); resolve();
  }, undefined, reject);
}));
for (const el of SCENE.elements) {
  const node = document.getElementById('el-' + el.id);
  const st = Object.assign({}, DEFAULTS);
  const apply = () => {
    node.style.transform = `translate(${st.x}px, ${st.y}px) rotate(${st.rot}deg) skewX(${st.skx}deg) scale(${st.sx}, ${st.sy})`;
    node.style.opacity = String(st.opacity);
  };
  for (const [prop, track] of Object.entries(el.tracks)) {
    const keys = track.keys;
    st[prop] = keys[0].v;
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      const ease = a.ease ? CustomEase.create('', `M0,0 C${a.ease[0]},${a.ease[1]} ${a.ease[2]},${a.ease[3]} 1,1`) : 'none';
      tl.fromTo(st, {[prop]: a.v}, {[prop]: b.v, duration: (b.t - a.t) / FPS, ease, immediateRender: false, onUpdate: apply}, a.t / FPS);
    }
  }
  const zAt = (f) => { let v = el.z.keys[0].v; for (const k of el.z.keys) if (k.t <= f) v = k.v; return v; };
  appliers.push((f) => {
    apply();
    node.style.visibility = (f >= el.visible[0] && f <= el.visible[1]) ? 'visible' : 'hidden';
    node.style.zIndex = String(zAt(f));
  });
}
window.__seek = (f) => {
  tl.time(f / FPS, false); for (const a of appliers) a(f);
  for (const [node, label, ranges, baseText, baseBackground, baseColor] of uiStates) {
    const state = (ranges.find(item => f >= item.frames[0] && f <= item.frames[1]) || {}).state || {};
    node.hidden = Boolean(state.hidden);
    if (label) label.textContent = typeof state.text === 'string' ? state.text : baseText;
    node.style.backgroundColor = /^#[0-9a-f]{3,8}$/i.test(state.background || '') ? state.background : baseBackground;
    node.style.color = /^#[0-9a-f]{3,8}$/i.test(state.color || '') ? state.color : baseColor;
  }
  for (const draw of modelRenders) draw(); return f;
};
window.__bbox = (id) => {
  const r = document.getElementById('el-' + id).getBoundingClientRect();
  const s = document.getElementById('stage').getBoundingClientRect();
  return [r.left - s.left, r.top - s.top, r.right - s.left, r.bottom - s.top];
};
Promise.all([document.fonts.ready, ...modelPromises]).then(() => { window.__seek(0); window.__ready = true; });
</script>
</body></html>
