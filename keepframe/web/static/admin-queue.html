<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title data-i18n="admin.title.queue">Keepframe Admin - Job Queue</title>
<link href="/static/css/app.css?v=20260921v" rel="stylesheet"/>
<link rel="icon" href="/static/icon.png" type="image/png"/>
<script type="module" src="/static/js/i18n.js?v=20260921v"></script>
<script type="module" src="/static/js/api.js?v=20260921v"></script>
<script type="module" src="/static/js/admin-queue.js?v=20260921v"></script>
<style>
.queue-canvas { flex: 1; overflow-y: auto; padding: 24px; }
.metrics-bar { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--hairline); padding-bottom: 16px; margin-bottom: 24px; }
.metrics-group { display: flex; gap: 16px; align-items: center; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 8px 16px; font-size: var(--fs-body-sm); white-space: nowrap; }
.metric-dot { width: 8px; height: 8px; border-radius: var(--r-full); }
.data-table { width: 100%; border-collapse: collapse; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-md); overflow: hidden; }
.data-table th { text-align: left; padding: 12px 16px; font-size: var(--fs-micro); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--hairline); background: var(--surface-1); }
.data-table td { padding: 12px 16px; border-bottom: 1px solid var(--hairline); font-size: var(--fs-body-sm); }
.data-table tr:hover td { background: var(--surface-1); }
.data-table tr.row-selected td { background: var(--hairline); }
.job-drawer { width: 320px; flex-shrink: 0; border-left: 1px solid var(--hairline); background: var(--surface-2); display: flex; flex-direction: column; }
.job-drawer__head { padding: 24px; border-bottom: 1px solid var(--hairline); }
.job-drawer__body { flex: 1; overflow-y: auto; padding: 24px; }
.job-drawer__foot { padding: 16px; border-top: 1px solid var(--hairline); }
.error-box { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 12px; font-family: ui-monospace, monospace; font-size: var(--fs-micro); color: var(--error); }
</style>
</head>
<body class="app app--fill">
<div class="admin-shell">
<nav class="admin-sidebar" data-i18n-aria="admin.ariaLabel" aria-label="Admin">
<div class="admin-sidebar__brand"><img class="header__logo" src="/static/logo.png" width="28" height="28" alt="Keepframe" data-i18n-aria="app.name"/>Keepframe</div>
<a class="admin-sidebar__link" href="/admin/tenants">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
<span data-i18n="admin.tenants">테넌트</span>
</a>
<a class="admin-sidebar__link admin-sidebar__link--active" href="/admin/queue" aria-current="page">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
<span data-i18n="admin.queue">작업 큐</span>
</a>
<a class="admin-sidebar__link" href="/admin/quarantine">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
<span data-i18n="admin.quarantine">검역</span>
</a>
<a class="admin-sidebar__link" href="/admin/audit">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
<span data-i18n="admin.audit">감사 로그</span>
</a>
<a class="admin-sidebar__link" href="/admin/llm">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z"/><path d="M19 15l.75 2.25L22 18l-2.25.75L19 21l-.75-2.25L16 18l2.25-.75z"/></svg>
<span data-i18n="admin.llm">LLM</span>
</a>
</nav>
<div class="admin-main">
<header class="header header--static">
<span data-i18n="admin.header.queue">Keepframe · 관리 · 작업 큐</span>
<button class="btn btn--ghost" data-i18n="lang.toggle" data-lang-toggle>EN</button>
</header>
<div class="admin-content">
<div class="queue-canvas">
<div class="metrics-bar">
<h2 style="margin:0;font-size:var(--fs-headline);font-weight:700" data-i18n="admin.queue.operationDesk">Operation Desk</h2>
<div style="display:flex;gap:16px">
<div class="metrics-group">
<span class="metric-dot" style="background:var(--secondary)"></span><span style="color:var(--muted)" data-i18n="admin.queue.queued">대기</span><strong id="queue-queued">—</strong>
<span style="color:var(--muted)">|</span>
<span class="metric-dot" style="background:var(--ink)"></span><span style="color:var(--muted)" data-i18n="admin.queue.running">실행</span><strong id="queue-running">—</strong>
<span style="color:var(--muted)">|</span>
<span class="metric-dot" style="background:var(--error)"></span><span style="color:var(--muted)" data-i18n="admin.queue.failed">실패</span><strong id="queue-failed">—</strong>
</div>
<div class="metrics-group"><span style="color:var(--muted)" data-i18n="admin.queue.gpuUsage">GPU 점유</span><strong class="mono" id="queue-gpu">—</strong></div>
</div>
</div>
<div class="admin-data-scroll"><table class="data-table">
<thead>
<tr><th data-i18n="admin.queue.jobId">Job ID</th><th data-i18n="admin.table.tenant">Tenant</th><th data-i18n="admin.queue.task">Task</th><th data-i18n="admin.queue.target">Target</th><th data-i18n="admin.table.status">Status</th><th data-i18n="admin.queue.resource">Resource</th><th data-i18n="admin.queue.duration">Duration</th><th data-i18n="admin.queue.retries">Retries</th></tr>
</thead>
<tbody id="job-rows"></tbody>
</table></div></div>
</div>
<aside class="job-drawer">
<div class="job-drawer__head">
<div id="drawer-id" class="mono" style="font-size:var(--fs-micro);color:var(--muted);margin-bottom:4px">—</div>
<h3 id="drawer-target" style="margin:0;font-size:var(--fs-headline);font-weight:700">—</h3>
</div>
<div class="job-drawer__body">
<div class="section-label" style="font-size:var(--fs-micro);color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px" data-i18n="admin.queue.failureReason">Failure Reason</div>
<div id="drawer-error" class="error-box">—</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px">
<div class="card"><div style="font-size:var(--fs-micro);color:var(--muted)" data-i18n="admin.queue.retries">Retries</div><div id="drawer-retries" style="font-size:var(--fs-headline);font-weight:700">—</div></div>
<div class="card"><div style="font-size:var(--fs-micro);color:var(--muted)" data-i18n="admin.queue.priority">Priority</div><div style="font-size:var(--fs-headline);font-weight:700" data-i18n="admin.queue.priorityDefault">P2</div></div>
</div>
<p id="drawer-policy" style="margin-top:24px;font-size:var(--fs-body-sm);color:var(--muted);font-style:italic"></p>
</div>
<div class="job-drawer__foot">
<button class="btn btn--secondary" type="button" style="width:auto;padding:8px 16px;margin-left:auto" data-i18n="admin.queue.viewLog">로그 보기</button>
</div>
</aside>
</div>
</div>
</div>
</body>
</html>
