<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Keepframe - LLM 프로바이더</title>
<link href="/static/css/app.css?v=20260921v" rel="stylesheet"/>
<link rel="icon" href="/static/icon.png" type="image/png"/>
<script type="module" src="/static/js/i18n.js?v=20260921v"></script>
<script type="module" src="/static/js/api.js?v=20260921v"></script>
<script type="module" src="/static/js/admin-llm.js?v=20260921v"></script>
<style>
.admin-panel__head { padding: 20px 24px; border-bottom: 1px solid var(--hairline); background: var(--surface-2); }
.admin-panel__head h2 { margin: 0 0 6px; font-size: var(--fs-headline); font-weight: 600; }
.admin-panel__head p { margin: 0; font-size: var(--fs-body-sm); color: var(--muted); line-height: 1.5; }
.admin-form { flex: 1; overflow-y: auto; padding: 24px; max-width: 640px; }
.form-grid { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: var(--fs-micro); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.field input, .field select, .field textarea { padding: 10px 12px; border: 1px solid var(--hairline); border-radius: var(--r-md); background: var(--surface-2); color: var(--ink); font-size: var(--fs-body-sm); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.field .mono { font-size: var(--fs-micro); color: var(--muted); }
.field textarea { font-family: ui-monospace, monospace; min-height: 88px; resize: vertical; }
.field--row { flex-direction: row; align-items: center; gap: 12px; }
.field--row label { width: 180px; flex-shrink: 0; }
.field--row input, .field--row select, .field--row textarea { flex: 1; }
.oauth-fields[hidden] { display: none; }
.api-key-field[hidden] { display: none; }
.oauth-chatgpt { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--hairline); border-radius: var(--r-md); background: var(--surface-2); }
.oauth-chatgpt p { margin: 0; font-size: var(--fs-body-sm); color: var(--muted); line-height: 1.5; }
.oauth-chatgpt__row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.oauth-status { font-size: var(--fs-body-sm); color: var(--ink); }
.oauth-advanced { margin-top: 4px; }
.oauth-advanced > summary { cursor: pointer; list-style: none; font-size: var(--fs-micro); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 0; }
.oauth-advanced > summary::-webkit-details-marker { display: none; }
.oauth-advanced[open] > summary { color: var(--ink); }
.model-pick { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.model-pick input, .model-pick select { flex: 1; min-width: 0; }
.admin-form__foot { padding: 16px 24px; border-top: 1px solid var(--hairline); display: flex; align-items: center; gap: 12px; background: var(--surface-2); }
.status-note { margin: 12px 24px 0; padding: 10px 12px; border-radius: var(--r-sm); font-size: var(--fs-body-sm); background: var(--surface-2); border: 1px solid var(--hairline); }
.status-note--err { color: var(--error); border-color: var(--error); }
.status-note[hidden] { display: none; }
</style>
</head>
<body class="app app--fill">
<nav class="admin-icon-nav" aria-label="Admin">
<a class="admin-icon-nav__link" href="/admin/tenants">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="6" rx="1"/><rect x="2" y="11" width="20" height="6" rx="1"/><rect x="2" y="19" width="20" height="4" rx="1"/></svg>
<span data-i18n="admin.tenants">테넌트</span>
</a>
<a class="admin-icon-nav__link" href="/admin/queue">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
<span data-i18n="admin.queue">작업 큐</span>
</a>
<a class="admin-icon-nav__link" href="/admin/quarantine">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
<span data-i18n="admin.quarantine">검역</span>
</a>
<a class="admin-icon-nav__link" href="/admin/audit">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
<span data-i18n="admin.audit">감사 로그</span>
</a>
<a class="admin-icon-nav__link admin-icon-nav__link--active" href="/admin/llm" aria-current="page">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z"/><path d="M19 15l.75 2.25L22 18l-2.25.75L19 21l-.75-2.25L16 18l2.25-.75z"/></svg>
<span data-i18n="admin.llm">LLM</span>
</a>
</nav>
<div class="admin-workspace">
<header class="admin-topbar">
<div class="admin-topbar__left">
<span class="admin-topbar__brand"><img class="header__logo" src="/static/logo.png" width="28" height="28" alt="Keepframe"/>Keepframe</span>
<span style="width:1px;height:16px;background:var(--hairline)"></span>
<span data-i18n="admin.manage">관리</span>
</div>
<div style="display:flex;align-items:center;gap:16px;font-size:var(--fs-body-sm)">
<button class="btn btn--ghost" data-i18n="lang.toggle" data-lang-toggle>EN</button>
</div>
</header>
<main class="admin-canvas">
<div class="admin-panel">
<div class="admin-panel__head">
<h2 data-i18n="admin.llm.title">LLM 프로바이더</h2>
<p data-i18n="admin.llm.desc">에이전트가 쓸 모델 공급자.</p>
</div>
<div class="status-note" id="status" hidden></div>
<div class="admin-form">
<div class="form-grid">
<div class="field field--row">
<label for="provider" data-i18n="admin.llm.provider">프로바이더</label>
<select id="provider"></select>
</div>
<div class="field field--row">
<label for="model" data-i18n="admin.llm.model">모델</label>
<div class="model-pick">
<input id="model" type="text" list="modelOptions" placeholder="gpt-4o-mini" autocomplete="off"/>
<datalist id="modelOptions"></datalist>
<button class="btn btn--ghost" id="reloadModels" type="button" data-i18n="admin.llm.reloadModels">불러오기</button>
</div>
</div>
<div class="field field--row" id="authField">
<label for="auth" data-i18n="admin.llm.auth">인증</label>
<select id="auth">
<option value="api_key" data-i18n="admin.llm.auth.apiKey">API 키</option>
<option value="oauth" data-i18n="admin.llm.auth.oauth">OAuth</option>
</select>
</div>
<div class="field field--row api-key-field" id="apiKeyField">
<label for="apiKey" data-i18n="admin.llm.apiKey">API 키</label>
<input id="apiKey" type="password" placeholder="sk-…" autocomplete="off"/>
</div>
<div class="oauth-fields" id="oauthFields" hidden>
<div class="oauth-chatgpt" id="chatgptOAuth">
<p data-i18n="admin.llm.chatgptHint">ChatGPT 구독으로 연결합니다. 뜨는 창에서 로그인하세요.</p>
<div class="oauth-chatgpt__row">
<button class="btn btn--primary" id="chatgptConnect" type="button" data-i18n="admin.llm.chatgptConnect">ChatGPT로 연결</button>
<button class="btn btn--ghost" id="chatgptDisconnect" type="button" hidden data-i18n="admin.llm.chatgptDisconnect">연결 해제</button>
<span class="oauth-status" id="chatgptStatus" hidden></span>
</div>
</div>
<details class="oauth-advanced" id="oauthAdvanced">
<summary data-i18n="admin.llm.oauthAdvanced">Azure / 기타 (자격 증명)</summary>
<div class="field field--row">
<label for="clientId" data-i18n="admin.llm.clientId">Client ID</label>
<input id="clientId" type="text" autocomplete="off"/>
</div>
<div class="field field--row">
<label for="clientSecret" data-i18n="admin.llm.clientSecret">Client Secret</label>
<input id="clientSecret" type="password" autocomplete="off"/>
</div>
<div class="field field--row">
<label for="tenantId" data-i18n="admin.llm.tenantId">Tenant ID</label>
<input id="tenantId" type="text" placeholder="Azure Entra (선택)"/>
</div>
<div class="field field--row">
<label for="tokenUrl" data-i18n="admin.llm.tokenUrl">Token URL</label>
<input id="tokenUrl" type="text" placeholder="https://…/oauth2/token"/>
</div>
<div class="field field--row">
<label for="scope" data-i18n="admin.llm.scope">Scope</label>
<input id="scope" type="text" placeholder="https://cognitiveservices.azure.com/.default"/>
</div>
<span class="mono" data-i18n="admin.llm.oauthHint">Azure Entra는 Tenant ID와 앱 자격 증명이 필요합니다. ChatGPT는 위 버튼을 쓰세요.</span>
</details>
</div>
<div class="field field--row" id="baseUrlField">
<label for="baseUrl" data-i18n="admin.llm.baseUrl">Base URL</label>
<input id="baseUrl" type="text" placeholder="https://… (선택)"/>
</div>
<div class="field">
<label for="extra" data-i18n="admin.llm.extra">추가 파라미터 (JSON)</label>
<textarea id="extra" spellcheck="false" placeholder='{"api_version":"2024-02-15-preview"}'></textarea>
<span class="mono" data-i18n="admin.llm.extraHint">api_version, vertex_project 등 LiteLLM 옵션. OAuth는 위에서 고릅니다.</span>
</div>
</div>
</div>
<div class="admin-form__foot">
<button class="btn btn--primary" id="save" type="button" data-i18n="admin.llm.save">저장</button>
<button class="btn btn--ghost" id="reset" type="button" data-i18n="admin.llm.reset">초기화</button>
</div>
</div>
</main>
</div>
</body>
</html>
