<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Keepframe · 관리 · 감사 로그</title>
<link href="/static/css/app.css?v=20260912" rel="stylesheet"/>
<link rel="icon" href="/static/icon.png" type="image/png"/>
<script type="module" src="/static/js/i18n.js?v=20260912"></script>
<script type="module" src="/static/js/api.js?v=20260912"></script>
<style>
.admin-shell { display: flex; height: 100vh; overflow: hidden; }
.admin-sidebar { width: 256px; flex-shrink: 0; background: var(--surface-2); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; padding: 16px 0; }
.admin-sidebar__brand { padding: 0 24px 8px; font-weight: 900; letter-spacing: -0.05em; font-size: var(--fs-headline); display: flex; align-items: center; gap: 8px; }
.admin-sidebar__sub { padding: 0 24px 24px; font-size: var(--fs-body-sm); color: var(--muted); }
.admin-sidebar__link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin: 0 8px; font-size: var(--fs-body-sm); color: var(--muted); border-radius: var(--r-md); }
.admin-sidebar__link:hover { background: var(--surface-1); color: var(--ink); }
.admin-sidebar__link--active { background: var(--hairline); color: var(--ink); font-weight: 700; }
.admin-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.audit-filters { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 16px; background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-md); margin-bottom: 24px; }
.audit-content { flex: 1; overflow-y: auto; padding: 24px 32px; }
.audit-table { width: 100%; border-collapse: collapse; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-md); overflow: hidden; }
.audit-table th { text-align: left; padding: 12px 16px; font-size: var(--fs-micro); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--hairline); background: var(--canvas); }
.audit-table td { padding: 12px 16px; border-bottom: 1px solid var(--hairline); font-size: var(--fs-body-sm); font-family: ui-monospace, monospace; }
.audit-table tr:hover td { background: var(--surface-1); }
.audit-footnote { margin-top: 24px; text-align: center; font-size: var(--fs-micro); color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; }
.filter-select { padding: 6px 32px 6px 12px; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-md); color: var(--ink); font-size: var(--fs-body-sm); }
</style>
</head>
<body class="app app--fill">
<div class="admin-shell">
<nav class="admin-sidebar" aria-label="Admin">
<div class="admin-sidebar__brand"><img class="header__logo" src="/static/logo.png" width="28" height="28" alt="Keepframe"/>Keepframe</div>
<div class="admin-sidebar__sub">Admin Console</div>
<a class="admin-sidebar__link" href="/admin/tenants">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
<span data-i18n="admin.tenants">테넌트</span>
</a>
<a class="admin-sidebar__link" href="/admin/queue">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
<span data-i18n="admin.queue">작업 큐</span>
</a>
<a class="admin-sidebar__link" href="/admin/quarantine">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
<span data-i18n="admin.quarantine">검역</span>
</a>
<a class="admin-sidebar__link admin-sidebar__link--active" href="/admin/audit" aria-current="page">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
<span data-i18n="admin.audit">감사 로그</span>
</a>
</nav>
<div class="admin-main">
<header class="header header--static">
<div style="display:flex;align-items:center;gap:12px">
<span>Keepframe · 관리 · 감사 로그</span>
<span class="chip" style="font-size:var(--fs-micro)">운영</span>
</div>
<button class="btn btn--ghost" data-i18n="lang.toggle" data-lang-toggle>EN</button>
</header>
<div class="audit-content">
<div class="audit-filters">
<div style="display:flex;flex-wrap:wrap;gap:12px">
<select class="filter-select" aria-label="Event type"><option>Event Type: All</option><option>keep 변경</option><option>내보내기</option><option>멤버</option><option>정지</option></select>
<select class="filter-select" aria-label="Tenant"><option>Tenant: All</option><option>Closed shop</option><option>Northwind</option></select>
<input class="filter-select" type="text" value="Today" aria-label="Date range"/>
</div>
<a class="btn btn--secondary" href="/admin/api/audit.csv" style="width:auto;padding:6px 16px;text-decoration:none">내보내기</a>
</div>
<table class="audit-table">
<thead>
<tr><th>Time</th><th>Actor</th><th>Action</th><th>Target/Tenant</th><th>Details</th></tr>
</thead>
<tbody id="audit-rows"></tbody>
</table>
<p class="audit-footnote">로그는 삭제할 수 없음. 내보내기만 가능.</p>
</div>
</div>
</div>
<script type="module">
import { api } from "/static/js/api.js";

const tbody = document.getElementById("audit-rows");

function actionStyle(action) {
  if (action.includes("정지") || action.includes("검역")) return "color:var(--error);font-weight:600";
  if (action.includes("keep")) return "color:var(--secondary)";
  return "";
}

api("/admin/api/audit").then((data) => {
  tbody.innerHTML = "";
  data.events.forEach((e) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
<td style="color:var(--muted)">${e.ts}</td>
<td>${e.actor}</td>
<td style="${actionStyle(e.action)}">${e.action}</td>
<td style="color:var(--muted)">${e.target}</td>
<td style="color:var(--muted)">${e.detail || "-"}</td>`;
    tbody.appendChild(tr);
  });
}).catch((err) => { if (err.status === 401) location = "/admin/login"; });
</script>
</body>
</html>
