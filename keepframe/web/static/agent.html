<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Keepframe - 에이전트</title>
<link href="/static/css/app.css?v=20260921v" rel="stylesheet"/>
<link rel="icon" href="/static/icon.png" type="image/png"/>
<script type="module" src="/static/js/i18n.js?v=20260921v"></script>
<script type="module" src="/static/js/api.js?v=20260921v"></script>
<script type="module" src="/static/js/agent.js?v=20260921v"></script>
</head>
<body class="app app--fill">
<header class="header header--static">
<div style="display:flex;align-items:center;gap:14px">
<span class="header__brand"><img class="header__logo" src="/static/logo.png" width="28" height="28" alt="Keepframe"/><span data-i18n="app.name">Keepframe</span></span>
<div class="header__divider"></div>
<h1 style="margin:0;font-size:var(--fs-headline);font-weight:700" data-i18n="agent.title">에이전트</h1>
<span id="agent-scene" class="mono" style="font-size:var(--fs-body-sm);color:var(--muted);background:var(--surface-1);padding:4px 10px;border-radius:var(--r-sm)">—</span>
</div>
<div class="header__nav">
<a class="btn btn--ghost" id="agent-back" href="/review" data-i18n="agent.backReview">검수로 돌아가기</a>
<a class="btn btn--ghost" href="/admin" data-i18n="admin.manage">관리</a>
<button class="btn btn--ghost" data-i18n="lang.toggle" data-lang-toggle>EN</button>
</div>
</header>
<main class="agent-shell" id="agent-root">
<aside class="agent-chat">
<div class="agent-chat__head">
<h2 data-i18n="agent.title">에이전트</h2>
<span class="agent-chat__meta" id="agent-model">—</span>
</div>
<div class="agent-chat__log" id="agent-log">
<p class="agent-empty" id="agent-empty" data-i18n="agent.empty">예: 문구를 Hello로 바꿔줘</p>
</div>
<div class="agent-tools" id="agent-tools">
<button class="tool" type="button" data-tool="analyze"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span data-i18n="agent.tool.analyze">분석</span></button>
<button class="tool" type="button" data-tool="correct"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 7h-9M14 3l6 4-6 4"/></svg><span data-i18n="agent.tool.correct">보정</span></button>
<button class="tool" type="button" data-tool="set_keep"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-i18n="agent.tool.keep">유지 지정</span></button>
<button class="tool" type="button" data-tool="edit"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span data-i18n="agent.tool.edit">재해석</span></button>
<button class="tool" type="button" data-tool="render"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3Z"/></svg><span data-i18n="agent.tool.render">렌더</span></button>
<button class="tool" type="button" data-tool="verify"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14l-3-3"/></svg><span data-i18n="agent.tool.verify">검증</span></button>
<button class="tool" type="button" data-tool="export"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg><span data-i18n="agent.tool.export">내보내기</span></button>
<button class="tool" type="button" data-tool="report"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg><span data-i18n="agent.tool.report">보고서</span></button>
</div>
<div class="agent-compose">
<textarea id="agent-input" rows="2" data-i18n-placeholder="agent.placeholder" placeholder="수정이나 검증, 내보내기를 적어 보내세요."></textarea>
<div class="agent-compose__row">
<span class="agent-compose__hint">Ctrl+Enter 전송</span>
<button class="btn btn--primary" id="agent-send" type="button" data-i18n="agent.send">전송</button>
</div>
</div>
<div class="agent-banner" id="agent-banner" role="status" hidden></div>
</aside>
<section class="agent-viewer">
<div class="compare-panes">
<div class="compare-pane">
<div class="compare-pane__head"><span data-i18n="agent.orig">원본</span></div>
<div class="compare-pane__body"><img id="agent-orig" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"/></div>
</div>
<div class="compare-pane">
<div class="compare-pane__head"><span style="color:var(--ink)" data-i18n="agent.recon">재구성</span></div>
<div class="compare-pane__body"><img id="agent-recon" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"/></div>
</div>
</div>
<div class="agent-transport">
<button class="btn--icon" id="agent-play" type="button" aria-label="재생">
<svg class="icon" id="agent-play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14l11-7z"/></svg>
<svg class="icon" id="agent-pause-icon" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
</button>
<button class="btn--icon transport__step" id="agent-prev" type="button" aria-label="이전 프레임"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
<button class="btn--icon transport__step" id="agent-next" type="button" aria-label="다음 프레임"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
<span class="mono" style="font-weight:700"><span id="agent-frame">0</span> <span style="color:var(--muted);font-weight:400">/ <span id="agent-total">0</span></span></span>
</div>
<div class="agent-elements">
<div class="agent-elements__head"><span data-i18n="agent.elements">요소 목록</span><span id="agent-count" class="mono">0</span></div>
<div class="agent-elements__list" id="agent-elements-list"></div>
</div>
</section>
</main>
</body>
</html>
