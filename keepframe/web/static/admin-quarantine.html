<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title data-i18n="admin.title.quarantine">Keepframe Admin Quarantine Desk</title>
<link href="/static/css/app.css?v=20260921v" rel="stylesheet"/>
<link rel="icon" href="/static/icon.png" type="image/png"/>
<script type="module" src="/static/js/i18n.js?v=20260921v"></script>
<script type="module" src="/static/js/api.js?v=20260921v"></script>
<script type="module" src="/static/js/admin-quarantine.js?v=20260921v"></script>
<style>
.admin-body { flex: 1; display: flex; overflow: hidden; }
.quarantine-split { flex: 1; display: flex; overflow: hidden; }
.quarantine-list { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--hairline); min-width: 0; }
.quarantine-list__head { padding: 16px 24px; border-bottom: 1px solid var(--hairline); display: flex; justify-content: space-between; align-items: center; }
.quarantine-table-head { display: grid; grid-template-columns: 3fr 2fr 2fr 4fr; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); font-size: var(--fs-micro); color: var(--muted); text-transform: uppercase; background: var(--surface-1); }
.quarantine-row { display: grid; grid-template-columns: 3fr 2fr 2fr 4fr; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); font-size: var(--fs-body-sm); align-items: center; cursor: pointer; position: relative; }
.quarantine-row:hover { background: var(--surface-2); }
.quarantine-row--selected { background: var(--hairline); }
.quarantine-row--selected::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ink); }
.quarantine-detail { width: 400px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--surface-1); }
.quarantine-detail__head { padding: 16px 24px; border-bottom: 1px solid var(--hairline); background: var(--surface-2); font-weight: 700; }
.quarantine-detail__body { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
.field-label { font-size: var(--fs-micro); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.reason-box { background: var(--surface-2); border: 1px solid var(--error); border-radius: var(--r-md); padding: 16px; color: var(--error); font-size: var(--fs-body-sm); }
.policy-box { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 16px; font-size: var(--fs-micro); color: var(--muted); line-height: 1.5; }
.quarantine-detail__foot { padding: 24px; border-top: 1px solid var(--hairline); display: flex; justify-content: flex-end; }
</style>
</head>
<body class="app app--fill">
<div class="admin-shell admin-shell--stack">
<header class="header header--static">
<div style="display:flex;align-items:center;gap:12px">
<span data-i18n="admin.header.quarantine">Keepframe · 관리 · 검역</span>
<span class="chip" style="font-size:var(--fs-micro)" data-i18n="admin.ops">운영</span>
</div>
<button class="btn btn--ghost" data-i18n="lang.toggle" data-lang-toggle>EN</button>
</header>
<div class="admin-body">
<nav class="admin-sidebar" data-i18n-aria="admin.ariaLabel" aria-label="Admin">
<div class="admin-sidebar__brand"><img class="header__logo" src="/static/logo.png" width="28" height="28" alt="Keepframe" data-i18n-aria="app.name"/>Keepframe</div>
<a class="admin-sidebar__link" href="/admin/tenants">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="6" rx="1"/><rect x="2" y="11" width="20" height="6" rx="1"/><rect x="2" y="19" width="20" height="4" rx="1"/></svg><span data-i18n="admin.tenants">테넌트</span>
</a>
<a class="admin-sidebar__link" href="/admin/queue">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="admin.queue">작업 큐</span>
</a>
<a class="admin-sidebar__link admin-sidebar__link--active" href="/admin/quarantine" aria-current="page">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span data-i18n="admin.quarantine">검역</span>
</a>
<a class="admin-sidebar__link" href="/admin/audit">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg><span data-i18n="admin.audit">감사 로그</span>
</a>
<a class="admin-sidebar__link" href="/admin/llm">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z"/><path d="M19 15l.75 2.25L22 18l-2.25.75L19 21l-.75-2.25L16 18l2.25-.75z"/></svg><span data-i18n="admin.llm">LLM</span>
</a>
</nav>
<main class="quarantine-split">
<div class="quarantine-list">
<div class="quarantine-list__head">
<h2 style="margin:0;font-size:var(--fs-headline);font-weight:700" data-i18n="admin.quarantine.pendingTitle">검역 대기 목록</h2>
<span class="chip" id="quarantine-count" style="font-size:var(--fs-micro)" data-i18n="admin.quarantine.count">0 항목</span>
</div>
<div class="quarantine-rows-scroll">
<div class="card" style="padding:0;overflow:hidden">
<div class="quarantine-table-head">
<div data-i18n="admin.quarantine.filename">파일명</div><div data-i18n="admin.table.tenant">테넌트</div><div data-i18n="admin.quarantine.rejectedAt">거부 일시</div><div data-i18n="admin.quarantine.reason">거부 사유</div>
</div>
<div id="quarantine-rows"></div>
</div>
</div>
</div>
<aside class="quarantine-detail">
<div class="quarantine-detail__head" data-i18n="admin.quarantine.details">거부 상세 정보</div>
<div class="quarantine-detail__body">
<div>
<div class="field-label" data-i18n="admin.quarantine.targetFile">대상 파일</div>
<div id="detail-filename" class="mono" style="font-size:var(--fs-body-sm);padding:8px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--r-md);word-break:break-all">—</div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div><div class="field-label" data-i18n="admin.table.tenant">테넌트</div><div id="detail-tenant">—</div></div>
<div><div class="field-label" data-i18n="admin.quarantine.detectedAt">탐지 시간</div><div id="detail-time" class="mono" style="font-size:var(--fs-body-sm)">—</div></div>
</div>
<div>
<div class="field-label" style="color:var(--error)" data-i18n="admin.quarantine.violation">위반 내역</div>
<div id="detail-reason" class="reason-box">—</div>
</div>
<p class="policy-box" id="detail-policy" data-i18n="admin.policy">재시도 상한 4회 · 에셋 생성 2회 · 관리자가 올릴 수 없음.</p>
</div>
<div class="quarantine-detail__foot">
<button class="btn btn--secondary" type="button" style="width:auto;padding:8px 16px" data-i18n="admin.quarantine.viewLog">로그만 보기</button>
</div>
</aside>
</main>
</div>
</div>
</body>
</html>
