<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Keepframe - 검수</title>
<link href="/static/css/app.css" rel="stylesheet"/>
<script type="module" src="/static/js/i18n.js"></script>
<script type="module" src="/static/js/api.js"></script>
<style>
.review-layout { height: calc(100vh - 56px); }
.compare-pane__body { position: relative; overflow: hidden; }
.compare-pane__body img { max-width: 100%; max-height: 100%; object-fit: contain; }
.compare-pane__overlay { position: absolute; inset: 0; pointer-events: none; }
#timeline-svg { width: 100%; height: 72px; display: block; cursor: pointer; }
#timeline-tracks { flex: 1; overflow-y: auto; min-height: 0; }
.inspector__forms[disabled] { opacity: 0.5; pointer-events: none; }
.job-banner { padding: 8px 12px; margin-bottom: 12px; border-radius: var(--r-sm); font-size: var(--fs-body-sm); background: var(--surface-2); }
.job-banner--error { color: var(--danger); }
.constraint-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: var(--fs-body-sm); }
.accordion__body { display: none; padding-top: 10px; }
.accordion--open .accordion__body { display: block; }
.accordion--open .accordion__head { color: var(--ink); }
.form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; font-size: var(--fs-body-sm); }
.form-row input, .form-row select { padding: 6px 8px; border: 1px solid var(--hairline); border-radius: var(--r-xs); background: var(--surface-1); color: var(--ink); }
.empty-state { color: var(--muted); font-size: var(--fs-body-sm); padding: 12px 0; }
</style>
</head>
<body class="app app--fill">
<header class="header header--static" style="height:56px">
<div style="display:flex;align-items:center;gap:16px">
<span class="header__brand" data-i18n="app.name">Keepframe</span>
<div class="header__divider"></div>
<h1 style="margin:0;font-size:var(--fs-headline);font-weight:700" data-i18n="nav.review">검수</h1>
<span id="scene-badge" style="font-size:var(--fs-body-sm);color:var(--muted);background:var(--surface-1);padding:4px 10px;border-radius:var(--r-sm)">—</span>
<select id="version-select" aria-label="version" style="margin-left:8px;padding:4px 8px;border:1px solid var(--hairline);border-radius:var(--r-xs);background:var(--surface-1);color:var(--ink)"></select>
</div>
<button class="btn btn--ghost" data-i18n="lang.toggle" data-lang-toggle>EN</button>
</header>
<main class="review-layout">
<div class="review-workspace">
<div class="compare-panes">
<div class="compare-pane">
<div class="compare-pane__head"><span data-i18n="review.orig">원본</span></div>
<div class="compare-pane__body" id="orig-pane">
<img id="orig" alt="original frame" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"/>
<svg class="compare-pane__overlay" id="orig-overlay"></svg>
</div>
</div>
<div class="compare-pane">
<div class="compare-pane__head"><span style="color:var(--ink)" data-i18n="review.recon">재구성</span></div>
<div class="compare-pane__body" id="recon-pane">
<img id="recon" alt="reconstructed frame" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"/>
<svg class="compare-pane__overlay" id="recon-overlay"></svg>
</div>
</div>
</div>
<div class="transport">
<div style="display:flex;align-items:center;gap:16px">
<button class="btn--icon" id="play-btn" type="button" aria-label="play" style="background:var(--hairline)">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14l11-7z"/></svg>
</button>
<span class="mono" style="font-weight:700"><span id="frame-num">0</span> <span style="color:var(--muted);font-weight:400">/ <span id="frame-total">0</span></span></span>
<span class="mono" style="color:var(--secondary);font-weight:700" id="frame-time">00:00.00</span>
</div>
</div>
<div class="timeline">
<div class="timeline__ruler">
<div class="timeline__labels">Tracks</div>
<svg id="timeline-svg" role="slider" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-label="timeline"></svg>
</div>
<div id="timeline-tracks"></div>
</div>
</div>
<aside class="inspector">
<div class="inspector__head"><span id="element-count">요소 0</span></div>
<div class="inspector__body">
<p class="job-banner" id="job-banner" role="status" hidden></p>
<div id="empty-state" class="empty-state" hidden data-i18n="review.empty">인식된 요소가 없습니다. 원본 화면에서 박스를 그려 첫 요소를 지정하세요.</div>
<div id="element-list"></div>
<div id="constraints-panel"></div>
<button class="btn btn--primary-lg" style="margin:24px 0" id="keep-save" data-i18n="review.keepSave" disabled>유지 조건 저장</button>
<div class="inspector__forms" id="forms-panel">
<div class="accordion" id="acc-reassign"><div class="accordion__head"><span data-i18n="review.reassign">재할당</span></div>
<div class="accordion__body"><div class="form-row"><label>from</label><input id="reassign-from" type="text"/></div>
<div class="form-row"><label>to</label><select id="reassign-to"></select></div>
<div class="form-row"><label>frames</label><input id="reassign-frames" type="text" placeholder="0,59"/></div>
<button class="btn btn--secondary" id="reassign-run" type="button" data-i18n="review.runReassign">재할당 실행</button></div></div>
<div class="accordion" id="acc-mask"><div class="accordion__head"><span data-i18n="review.mask">마스크</span></div>
<div class="accordion__body"><div class="form-row"><label>PNG</label><input id="mask-file" type="file" accept="image/png"/></div>
<div class="form-row"><label>frame</label><input id="mask-frame" type="number"/></div>
<button class="btn btn--secondary" id="mask-run" type="button" data-i18n="review.runMask">마스크 적용</button></div></div>
<div class="accordion accordion--open" id="acc-bbox"><div class="accordion__head"><span data-i18n="review.bbox">박스 프롬프트</span></div>
<div class="accordion__body"><div class="form-row"><label>frame</label><input id="bbox-frame" type="number"/></div>
<div class="form-row"><label>bbox</label><input id="bbox-coords" type="text" placeholder="x0,y0,x1,y1"/></div>
<button class="btn btn--secondary" id="bbox-run" type="button" data-i18n="review.runBbox">박스 적용</button></div></div>
<div class="accordion" id="acc-text"><div class="accordion__head"><span data-i18n="review.text">텍스트</span></div>
<div class="accordion__body"><div class="form-row"><label>text</label><input id="text-value" type="text"/></div>
<button class="btn btn--secondary" id="text-run" type="button" data-i18n="review.runText">텍스트 저장</button></div></div>
</div>
</div>
</aside>
</main>
<script type="module">
import {
  fetchReviewState,
  fetchReviewJob,
  postKeep,
  postCorrect,
  reviewFrameUrl,
} from "/static/js/api.js";
import { T, Tf } from "/static/js/i18n.js";

const params = new URLSearchParams(location.search);
const projectId = params.get("project");
const sceneId = params.get("scene") || "s1";
let versionId = params.get("v") || null;
let state = null;
let frame = 0;
let playing = false;
let raf = 0;
let lastTick = 0;
let keepDirty = false;
const keepPending = new Map();
let errorPeaks = [];
let pollTimer = 0;

const orig = document.getElementById("orig");
const recon = document.getElementById("recon");
const frameNum = document.getElementById("frame-num");
const frameTotal = document.getElementById("frame-total");
const frameTime = document.getElementById("frame-time");
const playBtn = document.getElementById("play-btn");
const versionSelect = document.getElementById("version-select");
const elementList = document.getElementById("element-list");
const constraintsPanel = document.getElementById("constraints-panel");
const emptyState = document.getElementById("empty-state");
const elementCount = document.getElementById("element-count");
const keepSave = document.getElementById("keep-save");
const formsPanel = document.getElementById("forms-panel");
const jobBanner = document.getElementById("job-banner");
const timelineSvg = document.getElementById("timeline-svg");
const timelineTracks = document.getElementById("timeline-tracks");
const sceneBadge = document.getElementById("scene-badge");
const reassignTo = document.getElementById("reassign-to");

let selectedId = null;

function formatTime(f, fps) {
  const sec = f / fps;
  const mm = String(Math.floor(sec / 60)).padStart(2, "0");
  const ss = String(Math.floor(sec % 60)).padStart(2, "0");
  const ff = String(Math.floor((sec % 1) * fps)).padStart(2, "0");
  return `${mm}:${ss}.${ff}`;
}

function setFrame(f) {
  if (!state) return;
  const n = state.scene.frames;
  frame = Math.max(0, Math.min(n - 1, f));
  frameNum.textContent = String(frame);
  frameTime.textContent = formatTime(frame, state.scene.fps);
  timelineSvg.setAttribute("aria-valuenow", String(frame));
  timelineSvg.setAttribute("aria-valuemax", String(n - 1));
  orig.src = reviewFrameUrl("orig", frame, projectId, sceneId, versionId);
  recon.src = reviewFrameUrl("recon", frame, projectId, sceneId, versionId);
  drawPlayhead();
}

function drawPlayhead() {
  const n = state?.scene?.frames || 1;
  const x = ((frame + 0.5) / n) * 100;
  timelineSvg.querySelectorAll(".playhead").forEach((el) => el.remove());
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("class", "playhead");
  line.setAttribute("x1", `${x}%`);
  line.setAttribute("x2", `${x}%`);
  line.setAttribute("y1", "0");
  line.setAttribute("y2", "72");
  line.setAttribute("stroke", "var(--accent)");
  line.setAttribute("stroke-width", "2");
  timelineSvg.appendChild(line);
}

function buildErrorStrip() {
  timelineSvg.innerHTML = "";
  const rep = state.report;
  const n = state.scene.frames;
  const errs = rep?.reconstruction?.per_frame_l1 || [];
  if (!errs.length) {
    for (let i = 0; i < n; i++) errs.push(0);
  }
  const sorted = [...errs].sort((a, b) => a - b);
  const thresh = sorted[Math.floor(sorted.length * 0.8)] || 0;
  errorPeaks = errs.map((v, i) => (v >= thresh ? i : -1)).filter((i) => i >= 0);
  const max = Math.max(...errs, 1e-6);
  errs.forEach((v, i) => {
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", `${(i / n) * 100}%`);
    rect.setAttribute("y", `${72 - (v / max) * 64}`);
    rect.setAttribute("width", `${100 / n}%`);
    rect.setAttribute("height", `${(v / max) * 64}`);
    rect.setAttribute("fill", v >= thresh ? "var(--danger)" : "var(--muted)");
    rect.dataset.frame = String(i);
    rect.addEventListener("click", () => setFrame(i));
    timelineSvg.appendChild(rect);
  });
  drawPlayhead();
}

function renderTracks() {
  timelineTracks.innerHTML = "";
  const els = state.scene.elements || [];
  els.forEach((el) => {
    const row = document.createElement("div");
    row.className = "track" + (el.id === selectedId ? " track--selected" : "");
    const vis = el.visible || [0, state.scene.frames - 1];
    const left = (vis[0] / state.scene.frames) * 100;
    const right = 100 - ((vis[1] + 1) / state.scene.frames) * 100;
    row.innerHTML = `<div class="track__label"><span class="mono" style="color:var(--accent)">${el.id}</span><span>${el.kind}</span></div>
      <div class="track__lane"><div class="track__bar" style="left:${left}%;right:${right}%"></div></div>`;
    row.addEventListener("click", () => selectElement(el.id));
    timelineTracks.appendChild(row);
  });
}

function renderElements() {
  const els = state.scene.elements || [];
  elementCount.textContent = Tf("review.elements", { n: els.length });
  emptyState.hidden = els.length > 0;
  document.getElementById("acc-bbox").classList.toggle("accordion--open", els.length === 0);
  elementList.innerHTML = "";
  constraintsPanel.innerHTML = "";
  reassignTo.innerHTML = "";
  els.forEach((el) => {
    const row = document.createElement("div");
    row.className = "element-row" + (el.id === selectedId ? " element-row--selected" : "");
    row.innerHTML = `<div style="display:flex;gap:12px"><span class="mono">${el.id}</span><span>${el.kind}</span></div>`;
    row.addEventListener("click", () => selectElement(el.id));
    elementList.appendChild(row);
    const opt = document.createElement("option");
    opt.value = el.id;
    opt.textContent = el.id;
    reassignTo.appendChild(opt);
  });
  const constraints = state.scene.constraints || [];
  if (constraints.length) {
    const head = document.createElement("div");
    head.style.fontWeight = "700";
    head.style.margin = "12px 0 6px";
    head.textContent = T("review.keep");
    constraintsPanel.appendChild(head);
    constraints.forEach((c) => {
      const row = document.createElement("label");
      row.className = "constraint-row";
      const checked = keepPending.has(c.pred) ? keepPending.get(c.pred) : !!c.keep;
      row.innerHTML = `<input type="checkbox" data-pred="${c.pred}" ${checked ? "checked" : ""}/><span class="mono">${c.pred}</span>`;
      row.querySelector("input").addEventListener("change", (e) => {
        keepPending.set(c.pred, e.target.checked);
        keepDirty = true;
        keepSave.disabled = false;
      });
      constraintsPanel.appendChild(row);
    });
  }
  renderTracks();
}

function selectElement(id) {
  selectedId = id;
  document.getElementById("reassign-from").value = id;
  document.getElementById("bbox-frame").value = String(frame);
  document.getElementById("mask-frame").value = String(frame);
  const el = state.scene.elements.find((e) => e.id === id);
  if (el?.canonical?.text != null) {
    document.getElementById("text-value").value = el.canonical.text;
  }
  renderElements();
}

function fillVersions() {
  versionSelect.innerHTML = "";
  const versions = (state.project.versions || []).filter((v) => v.scene_file.includes(`scenes/${sceneId}/`));
  versions.forEach((v) => {
    const opt = document.createElement("option");
    opt.value = v.id;
    opt.textContent = `${v.id} · ${v.note || ""}`;
    if (v.id === (versionId || state.version.id)) opt.selected = true;
    versionSelect.appendChild(opt);
  });
  versionSelect.onchange = () => {
    const v = versionSelect.value;
    location.href = `/review?project=${encodeURIComponent(projectId)}&scene=${encodeURIComponent(sceneId)}&v=${encodeURIComponent(v)}`;
  };
}

async function loadState() {
  state = await fetchReviewState(projectId, sceneId, versionId);
  versionId = state.version.id;
  sceneBadge.textContent = `${sceneId} · ${state.scene.frames}f`;
  frameTotal.textContent = String(state.scene.frames);
  fillVersions();
  renderElements();
  buildErrorStrip();
  if (!selectedId && state.scene.elements.length) selectElement(state.scene.elements[0].id);
  setFrame(frame);
}

function setJobBanner(msg, isError = false) {
  jobBanner.hidden = !msg;
  jobBanner.textContent = msg || "";
  jobBanner.classList.toggle("job-banner--error", isError);
}

function setFormsDisabled(disabled) {
  formsPanel.toggleAttribute("disabled", disabled);
  keepSave.disabled = disabled || !keepDirty;
}

async function pollJob() {
  if (!projectId) return;
  try {
    const job = await fetchReviewJob(projectId, sceneId);
    if (job.status === "running") {
      setFormsDisabled(true);
      setJobBanner(Tf("review.running", { op: job.op || "" }));
    } else if (job.status === "done" && job.version) {
      setFormsDisabled(false);
      setJobBanner("");
      location.href = `/review?project=${encodeURIComponent(projectId)}&scene=${encodeURIComponent(sceneId)}&v=${encodeURIComponent(job.version)}`;
    } else if (job.status === "error") {
      setFormsDisabled(false);
      setJobBanner(Tf("review.retry", { err: job.error || T("review.error") }), true);
    } else {
      setFormsDisabled(false);
      setJobBanner("");
    }
  } catch {
    /* ignore transient poll errors */
  }
}

async function runCorrect(op, args) {
  await postCorrect(projectId, sceneId, op, args);
  pollJob();
}

function nextErrorPeak(backward = false) {
  if (!errorPeaks.length) return;
  const idx = errorPeaks.findIndex((p) => p >= frame);
  if (backward) {
    const prev = [...errorPeaks].reverse().find((p) => p < frame);
    setFrame(prev != null ? prev : errorPeaks[errorPeaks.length - 1]);
  } else {
    setFrame(idx >= 0 ? errorPeaks[idx] : errorPeaks[0]);
  }
}

function tick(ts) {
  if (!playing) return;
  if (!lastTick) lastTick = ts;
  const dt = (ts - lastTick) / 1000;
  if (dt >= 1 / state.scene.fps) {
    lastTick = ts;
    if (frame >= state.scene.frames - 1) {
      playing = false;
      setFrame(state.scene.frames - 1);
      return;
    }
    setFrame(frame + 1);
  }
  raf = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  playing = !playing;
  lastTick = 0;
  if (playing) raf = requestAnimationFrame(tick);
  else cancelAnimationFrame(raf);
});

document.addEventListener("keydown", (e) => {
  if (!state || e.target.matches("input,select,textarea")) return;
  if (e.code === "Space") {
    e.preventDefault();
    playBtn.click();
  } else if (e.code === "ArrowLeft") {
    setFrame(frame - (e.shiftKey ? 10 : 1));
  } else if (e.code === "ArrowRight") {
    setFrame(frame + (e.shiftKey ? 10 : 1));
  } else if (e.key === "[") {
    nextErrorPeak(true);
  } else if (e.key === "]") {
    nextErrorPeak(false);
  }
});

timelineSvg.addEventListener("click", (e) => {
  const rect = timelineSvg.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  setFrame(Math.floor(x * state.scene.frames));
});

document.querySelectorAll(".accordion__head").forEach((head) => {
  head.addEventListener("click", () => head.parentElement.classList.toggle("accordion--open"));
});

keepSave.addEventListener("click", async () => {
  const changes = [...keepPending.entries()].map(([pred, keep]) => ({ pred, keep }));
  const res = await postKeep(projectId, sceneId, changes, "keep 조건 수정");
  keepPending.clear();
  keepDirty = false;
  keepSave.disabled = true;
  location.href = `/review?project=${encodeURIComponent(projectId)}&scene=${encodeURIComponent(sceneId)}&v=${encodeURIComponent(res.version.id)}`;
});

document.getElementById("reassign-run").addEventListener("click", async () => {
  const parts = document.getElementById("reassign-frames").value.split(",").map((s) => parseInt(s.trim(), 10));
  await runCorrect("reassign", {
    from_id: document.getElementById("reassign-from").value,
    to_id: reassignTo.value,
    frames: parts.length === 2 ? parts : [0, state.scene.frames - 1],
    object_id: reassignTo.value,
  });
});

document.getElementById("mask-run").addEventListener("click", async () => {
  const file = document.getElementById("mask-file").files[0];
  if (!file) return;
  const buf = await file.arrayBuffer();
  const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
  await runCorrect("mask", {
    frame: parseInt(document.getElementById("mask-frame").value, 10),
    mask_png_base64: b64,
    object_id: selectedId,
  });
});

document.getElementById("bbox-run").addEventListener("click", async () => {
  const bbox = document.getElementById("bbox-coords").value.split(",").map((s) => parseInt(s.trim(), 10));
  await runCorrect("bbox", {
    frame: parseInt(document.getElementById("bbox-frame").value, 10),
    bbox,
    object_id: selectedId,
  });
});

document.getElementById("text-run").addEventListener("click", async () => {
  await runCorrect("text", {
    element_id: selectedId,
    text: document.getElementById("text-value").value,
  });
});

(async () => {
  if (!projectId) {
    setJobBanner(T("review.needProject"), true);
    return;
  }
  try {
    await loadState();
    pollTimer = setInterval(pollJob, 700);
    pollJob();
  } catch (err) {
    setJobBanner(err.message || T("review.loadFailed"), true);
  }
})();

window.addEventListener("keepframe:lang", () => {
  if (state) renderElements();
});
</script>
</body>
</html>
