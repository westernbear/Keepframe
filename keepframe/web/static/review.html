<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Keepframe - 검수</title>
<link href="/static/css/app.css" rel="stylesheet"/>
<link rel="icon" href="/static/icon.png" type="image/png"/>
<script type="module" src="/static/js/i18n.js"></script>
<script type="module" src="/static/js/api.js"></script>
<style>
.review-layout { height: calc(100vh - 56px); }
.compare-pane__body { position: relative; overflow: hidden; }
.compare-pane__body img { max-width: 100%; max-height: 100%; object-fit: contain; }
.compare-pane__overlay { position: absolute; inset: 0; pointer-events: none; }
#timeline-svg { width: 100%; height: 72px; display: block; cursor: pointer; }
#timeline-tracks { flex: 1; overflow-y: auto; min-height: 0; }
.inspector__forms[disabled] { opacity: 0.5; pointer-events: none; }
.job-banner { padding: 8px 12px; margin-bottom: 12px; border-radius: var(--r-sm); font-size: var(--fs-body-sm); background: var(--surface-2); }
.job-banner--error { color: var(--error); }
.constraint-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: var(--fs-body-sm); }
.accordion__body { display: none; padding-top: 10px; }
.accordion--open .accordion__body { display: block; }
.accordion--open .accordion__head { color: var(--ink); }
.form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; font-size: var(--fs-body-sm); }
.form-row input, .form-row select { padding: 6px 8px; border: 1px solid var(--hairline); border-radius: var(--r-xs); background: var(--surface-1); color: var(--ink); }
.empty-state { color: var(--muted); font-size: var(--fs-body-sm); padding: 12px 0; }
</style>
</head>
<body class="app app--fill">
<header class="header header--static" style="height:56px">
<div style="display:flex;align-items:center;gap:16px">
<span class="header__brand"><img class="header__logo" src="/static/logo.png" width="28" height="28" alt=""/><span data-i18n="app.name">Keepframe</span></span>
<div class="header__divider"></div>
<h1 style="margin:0;font-size:var(--fs-headline);font-weight:700" data-i18n="nav.review">검수</h1>
<span id="scene-badge" style="font-size:var(--fs-body-sm);color:var(--muted);background:var(--surface-1);padding:4px 10px;border-radius:var(--r-sm)">—</span>
<select id="version-select" data-i18n-aria="review.version" aria-label="버전" style="margin-left:8px;padding:4px 8px;border:1px solid var(--hairline);border-radius:var(--r-xs);background:var(--surface-1);color:var(--ink)"></select>
</div>
<button class="btn btn--ghost" data-i18n="lang.toggle" data-lang-toggle>EN</button>
</header>
<main class="review-layout is-loading" id="review-root" aria-busy="true">
<div class="review-loading" id="review-loading" aria-live="polite">
<p id="review-loading-msg" data-i18n="review.loading">장면 불러오는 중</p>
<div class="review-loading__bar" id="review-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="review-loading-msg">
<div class="review-loading__fill" id="review-progress-fill"></div>
</div>
<span class="review-loading__pct" id="review-progress-pct">0%</span>
</div>
<div class="review-workspace">
<div class="compare-panes">
<div class="compare-pane">
<div class="compare-pane__head"><span data-i18n="review.orig">원본</span></div>
<div class="compare-pane__body" id="orig-pane">
<img id="orig" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"/>
<svg class="compare-pane__overlay" id="orig-overlay"></svg>
<div class="draw-layer" id="orig-draw" aria-label="박스 그리기"></div>
</div>
</div>
<div class="compare-pane">
<div class="compare-pane__head"><span style="color:var(--ink)" data-i18n="review.recon">재구성</span></div>
<div class="compare-pane__body" id="recon-pane">
<div class="pane-loading" id="recon-loading" hidden>
<div class="review-loading__bar review-loading__bar--pane"><div class="review-loading__fill review-loading__fill--pulse"></div></div>
</div>
<div class="pane-error" id="recon-error" hidden>
<p id="recon-error-msg" data-i18n="review.reconFailed">재구성 프레임을 불러오지 못했습니다.</p>
<button class="btn btn--secondary" type="button" id="recon-retry" data-i18n="review.retryFrame">다시 시도</button>
</div>
<img id="recon" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"/>
<svg class="compare-pane__overlay" id="recon-overlay"></svg>
</div>
</div>
</div>
<div class="transport">
<div style="display:flex;align-items:center;gap:8px">
<button class="btn--icon" id="play-btn" type="button" aria-label="재생">
<svg class="icon" id="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14l11-7z"/></svg>
<svg class="icon" id="pause-icon" viewBox="0 0 24 24" fill="currentColor" hidden style="display:none"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
</button>
<button class="btn--icon transport__step" id="step-back" type="button" data-i18n-aria="review.stepBack" aria-label="이전 프레임">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
</button>
<button class="btn--icon transport__step" id="step-fwd" type="button" data-i18n-aria="review.stepFwd" aria-label="다음 프레임">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
</button>
<button class="btn--icon transport__step" id="peak-back" type="button" data-i18n-aria="review.prevPeak" aria-label="이전 오차 봉우리">[</button>
<button class="btn--icon transport__step" id="peak-fwd" type="button" data-i18n-aria="review.nextPeak" aria-label="다음 오차 봉우리">]</button>
<span class="mono" style="font-weight:700"><span id="frame-num">0</span> <span style="color:var(--muted);font-weight:400">/ <span id="frame-total">0</span></span></span>
<span class="mono" style="color:var(--secondary);font-weight:700" id="frame-time">00:00:00</span>
</div>
<div class="transport__keys" id="transport-keys" data-i18n="review.keys">스페이스 재생 · ← → 프레임 · [ ] 오차</div>
</div>
<div class="timeline">
<div class="timeline__ruler">
<div class="timeline__labels" data-i18n="review.tracks">트랙</div>
<svg id="timeline-svg" role="slider" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-label="timeline"></svg>
</div>
<div class="timeline__body">
<div id="track-playhead" class="track-playhead" hidden></div>
<div id="timeline-tracks"></div>
</div>
</div>
</div>
<aside class="inspector">
<div class="inspector__head"><span id="element-count">요소 0</span></div>
<div class="inspector__body">
<p class="job-banner" id="job-banner" role="status" hidden></p>
<div id="empty-state" class="empty-state" hidden data-i18n="review.empty">인식된 요소가 없습니다. 원본에서 드래그해 첫 박스를 지정하세요.</div>
<input class="element-filter" id="element-filter" type="search" data-i18n-placeholder="review.filter" placeholder="요소 검색" hidden/>
<div id="element-list"></div>
<div id="constraints-panel"></div>
<button class="btn btn--primary-lg" style="margin:24px 0" id="keep-save" data-i18n="review.keepSave" hidden disabled>유지 조건 저장</button>
<div class="inspector__forms" id="forms-panel">
<div class="accordion" id="acc-reassign"><div class="accordion__head"><span data-i18n="review.reassign">재할당</span></div>
<div class="accordion__body"><div class="form-row"><label data-i18n="review.from">출발</label><input id="reassign-from" type="text"/></div>
<div class="form-row"><label data-i18n="review.to">도착</label><select id="reassign-to"></select></div>
<div class="form-row"><label data-i18n="review.frames">프레임</label><input id="reassign-frames" type="text" placeholder="0,59"/></div>
<button class="btn btn--secondary" id="reassign-run" type="button" data-i18n="review.runReassign">재할당 실행</button></div></div>
<div class="accordion" id="acc-mask"><div class="accordion__head"><span data-i18n="review.mask">마스크</span></div>
<div class="accordion__body"><div class="form-row"><label data-i18n="review.png">PNG</label><input id="mask-file" type="file" accept="image/png"/></div>
<div class="form-row"><label data-i18n="review.frame">프레임</label><input id="mask-frame" type="number"/></div>
<button class="btn btn--secondary" id="mask-run" type="button" data-i18n="review.runMask">마스크 적용</button></div></div>
<div class="accordion accordion--open" id="acc-bbox"><div class="accordion__head"><span data-i18n="review.bbox">박스 프롬프트</span></div>
<div class="accordion__body"><p class="empty-state" data-i18n="review.drawHint">원본에서 드래그해 박스를 지정하세요.</p>
<div class="form-row"><label data-i18n="review.frame">프레임</label><input id="bbox-frame" type="number"/></div>
<div class="form-row"><label data-i18n="review.bboxLabel">박스</label><input id="bbox-coords" type="text" placeholder="x0,y0,x1,y1"/></div>
<button class="btn btn--secondary" id="bbox-run" type="button" data-i18n="review.runBbox">박스 적용</button></div></div>
<div class="accordion" id="acc-text"><div class="accordion__head"><span data-i18n="review.text">텍스트</span></div>
<div class="accordion__body"><div class="form-row"><label>text</label><input id="text-value" type="text"/></div>
<button class="btn btn--secondary" id="text-run" type="button" data-i18n="review.runText">텍스트 저장</button></div></div>
</div>
</div>
</aside>
</main>
<script type="module">
import {
  fetchReviewState,
  fetchReviewJob,
  fetchBboxes,
  postKeep,
  postCorrect,
  reviewFrameUrl,
  reviewAssetUrl,
} from "/static/js/api.js";
import { T, Tf } from "/static/js/i18n.js";

const params = new URLSearchParams(location.search);
const projectId = params.get("project");
const sceneId = params.get("scene") || "s1";
let versionId = params.get("v") || null;
let state = null;
let frame = 0;
let playing = false;
let raf = 0;
let lastTick = 0;
let keepDirty = false;
const keepPending = new Map();
let errorPeaks = [];
let pollTimer = 0;

const orig = document.getElementById("orig");
const recon = document.getElementById("recon");
const frameNum = document.getElementById("frame-num");
const frameTotal = document.getElementById("frame-total");
const frameTime = document.getElementById("frame-time");
const playBtn = document.getElementById("play-btn");
const playIcon = document.getElementById("play-icon");
const pauseIcon = document.getElementById("pause-icon");
const trackPlayhead = document.getElementById("track-playhead");
const TRACK_GUTTER = 280;
const versionSelect = document.getElementById("version-select");
const elementList = document.getElementById("element-list");
const constraintsPanel = document.getElementById("constraints-panel");
const emptyState = document.getElementById("empty-state");
const elementCount = document.getElementById("element-count");
const keepSave = document.getElementById("keep-save");
const formsPanel = document.getElementById("forms-panel");
const jobBanner = document.getElementById("job-banner");
const timelineSvg = document.getElementById("timeline-svg");
const timelineTracks = document.getElementById("timeline-tracks");
const sceneBadge = document.getElementById("scene-badge");
const reassignTo = document.getElementById("reassign-to");

let selectedId = null;
let shownFrame = -1;
let imgTimer = 0;
let playheadEl = null;
const LIST_CHUNK = 32;
const CONSTRAINT_STEP = 128;
const reviewRoot = document.getElementById("review-root");
const loadingMsg = document.getElementById("review-loading-msg");
const progressBar = document.getElementById("review-progress");
const progressFill = document.getElementById("review-progress-fill");
const progressPct = document.getElementById("review-progress-pct");
const reconLoading = document.getElementById("recon-loading");
const reconError = document.getElementById("recon-error");
const origOverlay = document.getElementById("orig-overlay");
const reconOverlay = document.getElementById("recon-overlay");
const origDraw = document.getElementById("orig-draw");
const elementFilter = document.getElementById("element-filter");
let boxes = {};
let bboxReq = 0;
let drag = null;

function setProgress(pct, msg) {
  const n = Math.max(0, Math.min(100, Math.round(pct)));
  progressFill.style.transform = `scaleX(${n / 100})`;
  progressBar.setAttribute("aria-valuenow", String(n));
  progressPct.textContent = `${n}%`;
  if (msg) loadingMsg.textContent = msg;
  reviewRoot.classList.add("is-loading");
  reviewRoot.setAttribute("aria-busy", "true");
}

function clearLoading() {
  setProgress(100);
  reviewRoot.classList.remove("is-loading");
  reviewRoot.setAttribute("aria-busy", "false");
}

function yieldMain() {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

function waitImg(img) {
  if (img.complete && img.naturalWidth > 1) return Promise.resolve();
  return new Promise((resolve) => {
    const done = () => {
      img.removeEventListener("load", done);
      img.removeEventListener("error", done);
      resolve();
    };
    img.addEventListener("load", done);
    img.addEventListener("error", done);
  });
}

function formatTime(f, fps) {
  const sec = f / fps;
  const mm = String(Math.floor(sec / 60)).padStart(2, "0");
  const ss = String(Math.floor(sec % 60)).padStart(2, "0");
  const ff = String(Math.floor(f % fps)).padStart(2, "0");
  return `${mm}:${ss}:${ff}`;
}

function loadFrameImages() {
  imgTimer = 0;
  if (!state || shownFrame === frame) return;
  shownFrame = frame;
  reconLoading.hidden = false;
  reconError.hidden = true;
  orig.src = reviewFrameUrl("orig", frame, projectId, sceneId, versionId);
  recon.src = reviewFrameUrl("recon", frame, projectId, sceneId, versionId);
  if (recon.complete) reconLoading.hidden = true;
  loadBboxes();
  if (playing) {
    const n = state.scene.frames;
    for (let d = 1; d <= 3 && frame + d < n; d++) {
      for (const kind of ["orig", "recon"]) {
        const im = new Image();
        im.src = reviewFrameUrl(kind, frame + d, projectId, sceneId, versionId);
      }
    }
  }
}

function setFrame(f, immediate = false) {
  if (!state) return;
  const n = state.scene.frames;
  frame = Math.max(0, Math.min(n - 1, f));
  frameNum.textContent = String(frame);
  frameTime.textContent = formatTime(frame, state.scene.fps);
  timelineSvg.setAttribute("aria-valuenow", String(frame));
  timelineSvg.setAttribute("aria-valuemax", String(n - 1));
  drawPlayhead();
  if (shownFrame === frame) return;
  if (immediate) {
    clearTimeout(imgTimer);
    imgTimer = 0;
    loadFrameImages();
    return;
  }
  if (playing && imgTimer) return;
  clearTimeout(imgTimer);
  imgTimer = setTimeout(loadFrameImages, playing ? 40 : 32);
}

function mapBox(box, img, sceneW, sceneH) {
  const pane = img.parentElement.getBoundingClientRect();
  const ir = img.getBoundingClientRect();
  const scaleX = ir.width / Math.max(1, sceneW);
  const scaleY = ir.height / Math.max(1, sceneH);
  const ox = ir.left - pane.left;
  const oy = ir.top - pane.top;
  const [x0, y0, x1, y1] = box;
  return { x: ox + x0 * scaleX, y: oy + y0 * scaleY, w: (x1 - x0) * scaleX, h: (y1 - y0) * scaleY };
}

function overlayToScene(clientX, clientY, img, sceneW, sceneH) {
  const ir = img.getBoundingClientRect();
  const x = ((clientX - ir.left) / Math.max(1, ir.width)) * sceneW;
  const y = ((clientY - ir.top) / Math.max(1, ir.height)) * sceneH;
  return [x, y];
}

function paintOverlay(svg, img, box, draft = false) {
  const pane = img.parentElement;
  const pr = pane.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${pr.width} ${pr.height}`);
  svg.replaceChildren();
  if (!box || !state) return;
  const [sw, sh] = state.scene.size;
  const m = mapBox(box, img, sw, sh);
  const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  rect.setAttribute("class", draft ? "overlay-box overlay-box--draft" : "overlay-box");
  rect.setAttribute("x", String(m.x));
  rect.setAttribute("y", String(m.y));
  rect.setAttribute("width", String(Math.max(1, m.w)));
  rect.setAttribute("height", String(Math.max(1, m.h)));
  svg.appendChild(rect);
}

function drawOverlays() {
  const box = selectedId ? boxes[selectedId] : null;
  paintOverlay(origOverlay, orig, box);
  paintOverlay(reconOverlay, recon, box);
}

async function loadBboxes() {
  if (!state || !projectId) return;
  const id = ++bboxReq;
  const f = frame;
  try {
    const data = await fetchBboxes(projectId, sceneId, f, versionId);
    if (id !== bboxReq || f !== frame) return;
    boxes = data.boxes || {};
    drawOverlays();
  } catch {
    if (id === bboxReq) boxes = {};
  }
}

function drawPlayhead() {
  const n = state?.scene?.frames || 1;
  const x = ((frame + 0.5) / n) * 100;
  if (!playheadEl || !playheadEl.isConnected) {
    playheadEl = document.createElementNS("http://www.w3.org/2000/svg", "line");
    playheadEl.setAttribute("class", "playhead");
    playheadEl.setAttribute("y1", "0");
    playheadEl.setAttribute("y2", "72");
    playheadEl.setAttribute("stroke", "var(--accent)");
    playheadEl.setAttribute("stroke-width", "2");
    timelineSvg.appendChild(playheadEl);
  }
  playheadEl.setAttribute("x1", `${x}%`);
  playheadEl.setAttribute("x2", `${x}%`);
  if (trackPlayhead) {
    const body = trackPlayhead.parentElement;
    const lane = Math.max(0, (body ? body.clientWidth : 0) - TRACK_GUTTER);
    trackPlayhead.style.left = `${TRACK_GUTTER + (x / 100) * lane}px`;
    trackPlayhead.hidden = !state;
  }
}

function buildErrorStrip() {
  timelineSvg.innerHTML = "";
  playheadEl = null;
  const rec = state.report?.reconstruction;
  const bins = rec?.l1_bins || [];
  const hot = rec?.l1_hot || [];
  const max = rec?.l1_max || 1e-6;
  errorPeaks = rec?.l1_peaks || [];
  if (bins.length) {
    const frag = document.createDocumentFragment();
    for (let b = 0; b < bins.length; b++) {
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", `${(b / bins.length) * 100}%`);
      rect.setAttribute("y", `${72 - (bins[b] / max) * 64}`);
      rect.setAttribute("width", `${100 / bins.length}%`);
      rect.setAttribute("height", `${(bins[b] / max) * 64}`);
      rect.setAttribute("fill", hot[b] ? "var(--error)" : "var(--muted)");
      frag.appendChild(rect);
    }
    timelineSvg.appendChild(frag);
  }
  drawPlayhead();
}

function renderTracks(from = 0) {
  const els = state.scene.elements || [];
  if (from === 0) timelineTracks.innerHTML = "";
  const end = Math.min(els.length, from + LIST_CHUNK);
  const frag = document.createDocumentFragment();
  for (let i = from; i < end; i++) {
    const el = els[i];
    const row = document.createElement("div");
    row.className = "track" + (el.id === selectedId ? " track--selected" : "");
    row.dataset.id = el.id;
    const vis = el.visible || [0, state.scene.frames - 1];
    const left = (vis[0] / state.scene.frames) * 100;
    const right = 100 - ((vis[1] + 1) / state.scene.frames) * 100;
    row.innerHTML = `<div class="track__label"><span class="mono" style="color:var(--accent)">${el.id}</span><span>${el.kind}</span></div>
      <div class="track__lane"><div class="track__bar" style="left:${left}%;right:${right}%"></div></div>`;
    row.addEventListener("click", (ev) => {
      if (ev.target.closest(".track__lane")) {
        const lane = row.querySelector(".track__lane");
        const r = lane.getBoundingClientRect();
        const x = (ev.clientX - r.left) / r.width;
        setFrame(Math.floor(x * state.scene.frames), true);
      }
      selectElement(el.id);
    });
    frag.appendChild(row);
  }
  timelineTracks.appendChild(frag);
}

async function renderElements() {
  const els = state.scene.elements || [];
  elementCount.textContent = Tf("review.elements", { n: els.length });
  emptyState.hidden = els.length > 0;
  elementFilter.hidden = els.length === 0;
  document.getElementById("acc-bbox").classList.toggle("accordion--open", els.length === 0);
  elementList.innerHTML = "";
  constraintsPanel.innerHTML = "";
  reassignTo.innerHTML = "";
  timelineTracks.innerHTML = "";
  const n = Math.max(els.length, 1);
  for (let from = 0; from < els.length; from += LIST_CHUNK) {
    const end = Math.min(els.length, from + LIST_CHUNK);
    const frag = document.createDocumentFragment();
    const opts = document.createDocumentFragment();
    for (let i = from; i < end; i++) {
      const el = els[i];
      const row = document.createElement("div");
      row.className = "element-row" + (el.id === selectedId ? " element-row--selected" : "");
      row.dataset.id = el.id;
      const tex = el.canonical && el.canonical.texture;
      const thumb = tex
        ? `<img class="element-thumb" alt="" src="${reviewAssetUrl(tex, projectId, sceneId)}"/>`
        : `<span class="element-thumb"></span>`;
      row.innerHTML = `${thumb}<div style="display:flex;gap:12px;min-width:0"><span class="mono">${el.id}</span><span>${el.kind}</span></div>`;
      row.addEventListener("click", () => selectElement(el.id));
      frag.appendChild(row);
      const opt = document.createElement("option");
      opt.value = el.id;
      opt.textContent = el.id;
      opts.appendChild(opt);
    }
    elementList.appendChild(frag);
    reassignTo.appendChild(opts);
    renderTracks(from);
    setProgress(45 + (end / n) * 30, T("review.loadingList"));
    if (end < els.length) await yieldMain();
  }
  const constraints = state.scene.constraints || [];
  if (constraints.length) {
    const head = document.createElement("div");
    head.style.fontWeight = "700";
    head.style.margin = "12px 0 6px";
    head.textContent = T("review.keep");
    constraintsPanel.appendChild(head);
    await renderConstraints(0);
  }
}

function appendConstraintRow(frag, c) {
  const row = document.createElement("label");
  row.className = "constraint-row";
  const checked = keepPending.has(c.pred) ? keepPending.get(c.pred) : !!c.keep;
  row.innerHTML = `<input type="checkbox" data-pred="${c.pred}" ${checked ? "checked" : ""}/><span class="mono">${c.pred}</span>`;
  row.querySelector("input").addEventListener("change", (e) => {
    keepPending.set(c.pred, e.target.checked);
    keepDirty = true;
    keepSave.disabled = false;
    keepSave.hidden = false;
  });
  frag.appendChild(row);
}

async function renderConstraints(from) {
  const constraints = state.scene.constraints || [];
  const end = Math.min(constraints.length, from + CONSTRAINT_STEP);
  for (let s = from; s < end; s += LIST_CHUNK) {
    const e = Math.min(end, s + LIST_CHUNK);
    const frag = document.createDocumentFragment();
    for (let i = s; i < e; i++) appendConstraintRow(frag, constraints[i]);
    constraintsPanel.appendChild(frag);
    if (e < constraints.length) await yieldMain();
  }
  if (end < constraints.length) {
    const more = document.createElement("button");
    more.className = "btn btn--secondary";
    more.style.margin = "6px 0";
    more.textContent = Tf("review.moreConstraints", { n: constraints.length - end });
    more.addEventListener("click", () => {
      more.remove();
      renderConstraints(end);
    });
    constraintsPanel.appendChild(more);
  }
}

function selectElement(id) {
  selectedId = id;
  document.getElementById("reassign-from").value = id;
  document.getElementById("bbox-frame").value = String(frame);
  document.getElementById("mask-frame").value = String(frame);
  const el = state.scene.elements.find((e) => e.id === id);
  if (el?.canonical?.text != null) {
    document.getElementById("text-value").value = el.canonical.text;
  }
  elementList.querySelectorAll(".element-row").forEach((row) => {
    row.classList.toggle("element-row--selected", row.dataset.id === id);
  });
  timelineTracks.querySelectorAll(".track").forEach((row) => {
    row.classList.toggle("track--selected", row.dataset.id === id);
  });
  drawOverlays();
}

function applyElementFilter() {
  const q = (elementFilter.value || "").trim().toLowerCase();
  document.querySelectorAll(".element-row, .track").forEach((row) => {
    const id = (row.dataset.id || "").toLowerCase();
    const kind = (row.textContent || "").toLowerCase();
    row.hidden = Boolean(q) && !id.includes(q) && !kind.includes(q);
  });
}

function fillVersions() {
  versionSelect.innerHTML = "";
  const versions = state.project.versions || [];
  versions.forEach((v) => {
    const opt = document.createElement("option");
    opt.value = v.id;
    opt.textContent = `${v.id} · ${v.note || ""}`;
    if (v.id === (versionId || state.version.id)) opt.selected = true;
    versionSelect.appendChild(opt);
  });
  versionSelect.onchange = () => {
    refreshState(versionSelect.value);
  };
}

async function refreshState(v) {
  const keepFrame = frame;
  const keepSel = selectedId;
  versionId = v;
  setProgress(8, T("review.loading"));
  try {
    state = await fetchReviewState(projectId, sceneId, versionId);
  } catch (err) {
    clearLoading();
    setJobBanner(err.message || T("review.loadFailed"), true);
    return;
  }
  versionId = state.version.id;
  history.replaceState(null, "", `/review?project=${encodeURIComponent(projectId)}&scene=${encodeURIComponent(sceneId)}&v=${encodeURIComponent(versionId)}`);
  sceneBadge.textContent = `${sceneId} · ${state.scene.frames}f`;
  frameTotal.textContent = String(state.scene.frames);
  if (keepSel && state.scene.elements.some((e) => e.id === keepSel)) selectedId = keepSel;
  else if (!state.scene.elements.length) selectedId = null;
  fillVersions();
  await renderElements();
  buildErrorStrip();
  if (selectedId) selectElement(selectedId);
  frame = Math.max(0, Math.min(keepFrame, state.scene.frames - 1));
  shownFrame = -1;
  setFrame(frame, true);
  clearLoading();
}

async function loadState() {
  setProgress(8, T("review.loading"));
  orig.src = reviewFrameUrl("orig", 0, projectId, sceneId, versionId);
  const origReady = waitImg(orig);
  state = await fetchReviewState(projectId, sceneId, versionId);
  await yieldMain();
  setProgress(45, T("review.loading"));
  versionId = state.version.id;
  sceneBadge.textContent = `${sceneId} · ${state.scene.frames}f`;
  frameTotal.textContent = String(state.scene.frames);
  fillVersions();
  reconLoading.hidden = false;
  recon.src = reviewFrameUrl("recon", 0, projectId, sceneId, versionId);
  await renderElements();
  buildErrorStrip();
  if (!selectedId && state.scene.elements.length) selectElement(state.scene.elements[0].id);
  shownFrame = 0;
  frame = 0;
  setProgress(85, T("review.loadingFrames"));
  await origReady;
  loadBboxes();
  clearLoading();
}

function setJobBanner(msg, isError = false) {
  jobBanner.hidden = !msg;
  jobBanner.textContent = msg || "";
  jobBanner.classList.toggle("job-banner--error", isError);
}

function setFormsDisabled(disabled) {
  formsPanel.toggleAttribute("disabled", disabled);
  keepSave.disabled = disabled || !keepDirty;
  keepSave.hidden = !keepDirty;
}

async function pollJob() {
  if (!projectId) return;
  try {
    const job = await fetchReviewJob(projectId, sceneId);
    if (job.status === "running") {
      setFormsDisabled(true);
      setJobBanner(Tf("review.running", { op: job.op || "" }));
    } else if (job.status === "done" && job.version) {
      setFormsDisabled(false);
      setJobBanner("");
      clearInterval(pollTimer);
      refreshState(job.version);
    } else if (job.status === "error") {
      setFormsDisabled(false);
      setJobBanner(Tf("review.retry", { err: job.error || T("review.error") }), true);
      clearInterval(pollTimer);
    } else {
      setFormsDisabled(false);
      setJobBanner("");
      clearInterval(pollTimer);
    }
  } catch {
    /* ignore transient poll errors */
  }
}

async function runCorrect(op, args) {
  await postCorrect(projectId, sceneId, op, args);
  clearInterval(pollTimer);
  pollTimer = setInterval(pollJob, 800);
  pollJob();
}

function nextErrorPeak(backward = false) {
  if (!errorPeaks.length) return;
  const idx = errorPeaks.findIndex((p) => p >= frame);
  if (backward) {
    const prev = [...errorPeaks].reverse().find((p) => p < frame);
    setFrame(prev != null ? prev : errorPeaks[errorPeaks.length - 1]);
  } else {
    setFrame(idx >= 0 ? errorPeaks[idx] : errorPeaks[0]);
  }
}

function tick(ts) {
  if (!playing) return;
  if (!lastTick) lastTick = ts;
  const dt = (ts - lastTick) / 1000;
  if (dt >= 1 / state.scene.fps) {
    lastTick = ts;
    if (frame >= state.scene.frames - 1) {
      setPlaying(false);
      setFrame(state.scene.frames - 1, true);
      return;
    }
    setFrame(frame + 1);
  }
  raf = requestAnimationFrame(tick);
}

function setPlaying(on) {
  playing = !!on;
  lastTick = 0;
  playBtn.setAttribute("aria-label", playing ? T("review.pause") : T("review.play"));
  playBtn.classList.toggle("is-playing", playing);
  playIcon.hidden = playing;
  pauseIcon.hidden = !playing;
  playIcon.style.display = playing ? "none" : "";
  pauseIcon.style.display = playing ? "inline-block" : "none";
  cancelAnimationFrame(raf);
  raf = 0;
  if (playing) raf = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  setPlaying(!playing);
});

document.addEventListener("keydown", (e) => {
  if (!state || e.target.matches("input,select,textarea")) return;
  if (e.code === "Space") {
    e.preventDefault();
    playBtn.click();
  } else if (e.code === "ArrowLeft") {
    setFrame(frame - (e.shiftKey ? 10 : 1));
  } else if (e.code === "ArrowRight") {
    setFrame(frame + (e.shiftKey ? 10 : 1));
  } else if (e.key === "[") {
    nextErrorPeak(true);
  } else if (e.key === "]") {
    nextErrorPeak(false);
  }
});

timelineSvg.addEventListener("click", (e) => {
  const rect = timelineSvg.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  setFrame(Math.floor(x * state.scene.frames), true);
});

document.querySelectorAll(".accordion__head").forEach((head) => {
  head.addEventListener("click", () => {
    const acc = head.parentElement;
    const open = acc.classList.contains("accordion--open");
    document.querySelectorAll(".accordion").forEach((a) => a.classList.remove("accordion--open"));
    if (!open) acc.classList.add("accordion--open");
  });
});
elementFilter.addEventListener("input", applyElementFilter);
document.getElementById("step-back").addEventListener("click", () => setFrame(frame - 1, true));
document.getElementById("step-fwd").addEventListener("click", () => setFrame(frame + 1, true));
document.getElementById("peak-back").addEventListener("click", () => nextErrorPeak(true));
document.getElementById("peak-fwd").addEventListener("click", () => nextErrorPeak(false));
document.getElementById("recon-retry").addEventListener("click", () => setFrame(frame, true));

origDraw.addEventListener("pointerdown", (e) => {
  if (!state) return;
  origDraw.setPointerCapture(e.pointerId);
  const [sw, sh] = state.scene.size;
  const [x, y] = overlayToScene(e.clientX, e.clientY, orig, sw, sh);
  drag = { x0: x, y0: y, x1: x, y1: y };
});
origDraw.addEventListener("pointermove", (e) => {
  if (!drag || !state) return;
  const [sw, sh] = state.scene.size;
  const [x, y] = overlayToScene(e.clientX, e.clientY, orig, sw, sh);
  drag.x1 = x;
  drag.y1 = y;
  const box = [Math.min(drag.x0, drag.x1), Math.min(drag.y0, drag.y1), Math.max(drag.x0, drag.x1), Math.max(drag.y0, drag.y1)];
  paintOverlay(origOverlay, orig, box, true);
});
origDraw.addEventListener("pointerup", () => {
  if (!drag || !state) return;
  const box = [Math.min(drag.x0, drag.x1), Math.min(drag.y0, drag.y1), Math.max(drag.x0, drag.x1), Math.max(drag.y0, drag.y1)];
  drag = null;
  if (box[2] - box[0] < 2 || box[3] - box[1] < 2) {
    drawOverlays();
    return;
  }
  document.getElementById("bbox-coords").value = box.map((v) => Math.round(v)).join(",");
  document.getElementById("bbox-frame").value = String(frame);
  document.querySelectorAll(".accordion").forEach((a) => a.classList.remove("accordion--open"));
  document.getElementById("acc-bbox").classList.add("accordion--open");
  paintOverlay(origOverlay, orig, box);
});
orig.addEventListener("load", () => drawOverlays());

keepSave.addEventListener("click", async () => {
  const changes = [...keepPending.entries()].map(([pred, keep]) => ({ pred, keep }));
  const res = await postKeep(projectId, sceneId, changes, "keep 조건 수정");
  keepPending.clear();
  keepDirty = false;
  keepSave.disabled = true;
  keepSave.hidden = true;
  refreshState(res.version.id);
});

document.getElementById("reassign-run").addEventListener("click", async () => {
  const parts = document.getElementById("reassign-frames").value.split(",").map((s) => parseInt(s.trim(), 10));
  await runCorrect("reassign", {
    from_id: document.getElementById("reassign-from").value,
    to_id: reassignTo.value,
    frames: parts.length === 2 ? parts : [0, state.scene.frames - 1],
    object_id: reassignTo.value,
  });
});

document.getElementById("mask-run").addEventListener("click", async () => {
  const file = document.getElementById("mask-file").files[0];
  if (!file) return;
  const buf = await file.arrayBuffer();
  const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
  await runCorrect("mask", {
    frame: parseInt(document.getElementById("mask-frame").value, 10),
    mask_png_base64: b64,
    object_id: selectedId,
  });
});

document.getElementById("bbox-run").addEventListener("click", async () => {
  const bbox = document.getElementById("bbox-coords").value.split(",").map((s) => parseInt(s.trim(), 10));
  await runCorrect("bbox", {
    frame: parseInt(document.getElementById("bbox-frame").value, 10),
    bbox,
    object_id: selectedId,
  });
});

document.getElementById("text-run").addEventListener("click", async () => {
  await runCorrect("text", {
    element_id: selectedId,
    text: document.getElementById("text-value").value,
  });
});

recon.addEventListener("load", () => {
  reconLoading.hidden = true;
  reconError.hidden = true;
  drawOverlays();
});
recon.addEventListener("error", () => {
  reconLoading.hidden = true;
  reconError.hidden = false;
});

playBtn.setAttribute("aria-label", T("review.play"));

(async () => {
  if (!projectId) {
    clearLoading();
    setJobBanner(T("review.needProject"), true);
    return;
  }
  try {
    await loadState();
    pollJob();
  } catch (err) {
    clearLoading();
    setJobBanner(err.message || T("review.loadFailed"), true);
  }
})();

window.addEventListener("keepframe:lang", () => {
  if (state) renderElements();
  playBtn.setAttribute("aria-label", playing ? T("review.pause") : T("review.play"));
});
window.addEventListener("resize", () => {
  if (state) {
    drawPlayhead();
    drawOverlays();
  }
});
</script>
</body>
</html>
