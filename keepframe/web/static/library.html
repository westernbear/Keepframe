<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Keepframe - Project Library</title>
<link href="/static/css/app.css?v=20260914" rel="stylesheet"/>
<link rel="icon" href="/static/icon.png" type="image/png"/>
<script type="module" src="/static/js/i18n.js?v=20260914"></script>
<script type="module" src="/static/js/api.js?v=20260914"></script>
</head>
<body class="app">
<header class="header">
<div class="header__brand"><img class="header__logo" src="/static/logo.png" width="28" height="28" alt="Keepframe"/><span data-i18n="app.name">Keepframe</span></div>
<div class="header__nav">
<button class="btn btn--ghost" data-i18n="lang.toggle" data-lang-toggle>EN</button>
<a class="btn btn--primary" href="/new">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
<span data-i18n="nav.new">새 레퍼런스</span>
</a>
</div>
</header>
<nav class="sidebar">
<a class="sidebar__link sidebar__link--active" href="/library">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"/><path d="M3 7l9-4 9 4"/></svg>
<span data-i18n="nav.library">Library</span>
</a>
<a class="sidebar__link" href="/analyze">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 4-6"/></svg>
<span data-i18n="nav.analyze">분석</span>
</a>
<a class="sidebar__link" href="/review">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
<span data-i18n="nav.review">검수</span>
</a>
</nav>
<main class="main">
<div class="toolbar">
<div class="input-wrap" style="max-width:384px;width:100%">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
<input class="input" type="search" placeholder="프로젝트 검색" data-i18n="library.search" data-search/>
</div>
<div class="toolbar__filters">
<button class="chip chip--active" type="button" data-filter="all" data-i18n="library.filter.recent">최근</button>
<button class="chip" type="button" data-filter="review" data-i18n="library.filter.review">검수 필요</button>
</div>
</div>
<div id="library-empty" class="page-desc" style="padding:24px 0" hidden>
<p data-i18n="library.empty">프로젝트가 없습니다. 새 프로젝트에서 레퍼런스를 올리세요.</p>
<p style="margin-top:12px;display:flex;flex-wrap:wrap;gap:12px">
<a class="btn btn--primary" href="/new" data-i18n="nav.new">새 레퍼런스</a>
<a class="btn btn--secondary btn--inline" href="/demo" data-i18n="nav.demo">샘플 결과</a>
</p>
</div>
<div id="project-list"></div>
</main>
<footer class="footer">
<span data-i18n="library.scope">평면 2D 모션그래픽과 UI 화면 녹화만 받습니다.</span>
</footer>
<script type="module">
import { api } from "/static/js/api.js?v=20260914";
import { T, Tf, applyI18n } from "/static/js/i18n.js?v=20260914";

function statusLabel(status) {
  return T(`status.${status}`) === `status.${status}` ? status : T(`status.${status}`);
}

const BADGE_CLASS = {
  uploaded: "badge--done",
  analyzing: "badge--active",
  review: "badge--active",
  approved: "badge--done",
  error: "badge--error",
  rejected: "badge--error",
};

function rowHref(p) {
  if (p.status === "analyzing" || p.status === "uploaded") {
    return `/analyze?job=${encodeURIComponent(p.id)}`;
  }
  if (p.status === "review" || p.status === "approved") {
    const scene = p.scene || "s1";
    return `/review?project=${encodeURIComponent(p.id)}&scene=${encodeURIComponent(scene)}`;
  }
  return null;
}

function formatVersion(v) {
  if (v == null || v === "") return null;
  const s = String(v);
  return s.startsWith("v") ? s : `v${s}`;
}

function formatConfidence(c) {
  if (c == null) return null;
  return typeof c === "number" ? c.toFixed(2) : String(c);
}

function badgeText(p) {
  if (p.status === "rejected") {
    return p.reason || p.error || statusLabel("rejected");
  }
  if (p.status === "error" && p.error) {
    return p.error;
  }
  return statusLabel(p.status);
}

function renderProject(p, index) {
  const row = document.createElement("div");
  row.className = "row";
  if (index > 0) row.style.marginTop = "8px";

  const thumb = document.createElement("div");
  thumb.className = "row__thumb";
  if (p.status !== "rejected") {
    const img = document.createElement("img");
    img.src = `/api/projects/${encodeURIComponent(p.id)}/frame/0`;
    img.alt = "";
    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "cover";
    img.onerror = () => { img.remove(); };
    thumb.appendChild(img);
  }

  const body = document.createElement("div");
  body.className = "row__body";

  const title = document.createElement("div");
  title.className = "row__title";
  title.textContent = p.title || p.id;

  const meta = document.createElement("div");
  meta.className = "row__meta";
  const ver = formatVersion(p.version);
  if (ver) {
    const span = document.createElement("span");
    span.textContent = ver;
    meta.appendChild(span);
  }
  const conf = formatConfidence(p.confidence);
  if (conf != null) {
    const span = document.createElement("span");
    span.textContent = Tf("library.confidence", { c: conf });
    meta.appendChild(span);
  }

  const badge = document.createElement("span");
  badge.className = `badge ${BADGE_CLASS[p.status] || "badge--done"}`;
  badge.textContent = badgeText(p);

  body.append(title, meta, badge);
  row.append(thumb, body);

  const href = rowHref(p);
  if (href) {
    row.style.cursor = "pointer";
    row.addEventListener("click", () => { location.href = href; });
  }

  return row;
}

let cached = [];
let filter = "all";
let query = "";

function visibleProjects(projects) {
  const q = query.trim().toLowerCase();
  return projects.filter((p) => {
    if (filter === "review" && p.status !== "review") return false;
    if (!q) return true;
    const hay = `${p.title || ""} ${p.id || ""}`.toLowerCase();
    return hay.includes(q);
  });
}

function paint(projects) {
  const list = document.getElementById("project-list");
  const empty = document.getElementById("library-empty");
  cached = projects;
  const shown = visibleProjects(projects);
  list.innerHTML = "";
  if (!shown.length) {
    empty.hidden = false;
    applyI18n(empty);
    return;
  }
  empty.hidden = true;
  shown.forEach((p, i) => list.appendChild(renderProject(p, i)));
}

document.querySelector("[data-search]").addEventListener("input", (e) => {
  query = e.target.value || "";
  paint(cached);
});
document.querySelectorAll("[data-filter]").forEach((btn) => {
  btn.addEventListener("click", () => {
    filter = btn.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach((el) => {
      el.classList.toggle("chip--active", el === btn);
    });
    paint(cached);
  });
});

(async () => {
  const empty = document.getElementById("library-empty");
  try {
    const { projects } = await api("/api/projects");
    paint(projects);
  } catch (err) {
    paint([]);
    const msg = empty.querySelector("[data-i18n='library.empty']");
    if (msg) msg.textContent = err.message || T("library.loadFailed");
  }
})();

window.addEventListener("keepframe:lang", () => paint(cached));
</script>
</body>
</html>
